# calibration.yaml — the rgw-go measurements the calibrated preset is derived
# from. Free-form (docs/cost-model.md, "YAML shapes"). Token volumes are in millions
# unless a key says otherwise. Every derived ratio carries its arithmetic.

project:
  name: rgw-go
  repo: jhoblitt/rgw-go
  commit: 239f789
  commit_date: "2026-11-13"
  ports: { repo: ceph/ceph, tag: v19.2.7, paths: [src/rgw, "src/cls (RGW classes, see source)"] }

