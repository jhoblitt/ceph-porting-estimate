# calibration.yaml — the rgw-go measurements the calibrated preset is derived
# from. Free-form for display (docs/cost-model.md, "YAML shapes"), but cephest
# check reads the keys the assumptions are derived from and fails when
# assumptions.yaml no longer matches them. Token volumes are in millions
# unless a key says otherwise. Every derived ratio carries its arithmetic.

