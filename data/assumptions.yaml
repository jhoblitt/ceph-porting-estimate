# assumptions.yaml — every number the cost model applies to Ceph. Shapes and
# formulas: docs/cost-model.md. Each quantity is
#   { value, measured, source, reason }.
# Measured values come from calibration.yaml (rgw-go at 239f789); the rest are
# assumptions, each with a reason a reader can weigh.

ceph: { repo: ceph/ceph, rev: ec322a5e95ebcb46dec7d6a9d7813a34543c64ad }

# Bytes per token by language. NOT measured with a tokenizer. They are values
# typical of current Claude-family tokenizers on source code: about 3–4 bytes per
# token, more for prose, fewer for symbol-heavy code and data formats.
# Two of them are largely harmless, provided the parameters calibrated with them
# are recomputed whenever they change (cephest check fails until they are). The
# Go value cancels entirely: expansion ∝ 1 ÷ go and overhead ∝ go. The C++
# value's error cancels for C++ features only once expansion is recomputed with
# it (expansion ∝ cpp, a C++ feature's tokens ∝ 1 ÷ cpp); it still moves every
# other language's features through expansion, which moves the total by about
# 2% for a 25% change.
# Ratios between the other languages and C++ move the estimate directly.
# Keys are the SLOC counter's language names. A language with no entry uses
# `default`. Binary files carry no tokens.
bytes_per_token:
  default:            { value: 3.5, measured: false, source: assumption, reason: "Middle of the 3–4 bytes/token range typical for code; used for any language not listed" }
  c:                  { value: 3.5, measured: false, source: assumption, reason: "Same as C++: similar syntax, identifier lengths and indentation in Ceph" }
  cpp:                { value: 3.5, measured: false, source: assumption, reason: "C++ sources and headers; equal to Go so that E is a plain byte ratio for C++ features; its error cancels for C++ features once E is recomputed with it, see the header comment" }
  python:             { value: 3.7, measured: false, source: assumption, reason: "Fewer braces and more words than C-family code, so slightly more bytes per token" }
  shell:              { value: 3.3, measured: false, source: assumption, reason: "Dense in symbols ($, quotes, pipes, flags), so slightly fewer bytes per token than C++" }
  go:                 { value: 3.5, measured: false, source: assumption, reason: "Typical for Go; equal to C++, see the header comment. Used for rgw-go's sizes in calibration.yaml" }
  rust:               { value: 3.3, measured: false, source: assumption, reason: "More sigils and short keywords (&, ::, ', ?) than C++" }
  java:               { value: 3.8, measured: false, source: assumption, reason: "Long identifiers and verbose type names that tokenize into long pieces" }
  typescript:         { value: 3.5, measured: false, source: assumption, reason: "Similar to C-family code" }
  javascript:         { value: 3.4, measured: false, source: assumption, reason: "Similar to TypeScript with fewer long type annotations" }
  html:               { value: 3.2, measured: false, source: assumption, reason: "Markup is tag- and attribute-heavy, so it splits into many short tokens" }
  css:                { value: 3.0, measured: false, source: assumption, reason: "CSS and SCSS: selectors, numbers and units split into many short tokens" }
  yaml:               { value: 3.0, measured: false, source: assumption, reason: "Short keys, indentation and punctuation; sparser than code" }
  json:               { value: 2.8, measured: false, source: assumption, reason: "Quotes, colons and braces around short values; the most symbol-heavy format listed" }
  cmake:              { value: 3.4, measured: false, source: assumption, reason: "Function-call syntax with variable references; close to shell" }
  markdown:           { value: 4.0, measured: false, source: assumption, reason: "Mostly English prose, which tokenizes more densely than code" }
  rst:                { value: 4.0, measured: false, source: assumption, reason: "Mostly English prose, as Markdown" }
  lua:                { value: 3.5, measured: false, source: assumption, reason: "Similar to Python and C-family code" }
  perl:               { value: 3.2, measured: false, source: assumption, reason: "Sigil- and regex-heavy" }
  jinja:              { value: 3.3, measured: false, source: assumption, reason: "Templates mix markup with {{ }} and {% %} delimiters" }
  jsonnet:            { value: 3.2, measured: false, source: assumption, reason: "Close to JSON, with fewer quotes" }
  cython:             { value: 3.7, measured: false, source: assumption, reason: "Python syntax with C type declarations; taken as Python" }
  xml:                { value: 3.0, measured: false, source: assumption, reason: "Tags and attributes split into many short tokens, as HTML does, with long repeated element names" }
  ini:                { value: 3.2, measured: false, source: assumption, reason: "Short key = value lines, close to YAML" }
  toml:               { value: 3.2, measured: false, source: assumption, reason: "Short key = value lines, close to YAML" }
  protobuf:           { value: 3.5, measured: false, source: assumption, reason: "C-like declarations" }
  make:               { value: 3.4, measured: false, source: assumption, reason: "Close to shell and CMake" }
  dockerfile:         { value: 3.4, measured: false, source: assumption, reason: "Mostly shell commands" }
  cram:               { value: 3.3, measured: false, source: assumption, reason: "Shell commands with their expected output; taken as shell" }
  text:               { value: 4.0, measured: false, source: assumption, reason: "Plain text files, mostly prose or word lists" }

params:
  # ---- calibrated from rgw-go (calibration.yaml "derived"; cephest check
  # recomputes each one and fails when it no longer matches) ----
  expansion:
    # 1,337,661 / (2,756,184 × 0.37) = 1.31171; at coverage 0.30 1.6178 (every
    # figure 23% higher), at 0.40 1.2133 (7.5% lower)
    value: 1.3117
    measured: false
    source: calibration.yaml
    reason: >-
      Product Go tokens rgw-go wrote per token of the v19.2.7 source it ported: its product Go over the
      size of that source times coverage, the share of it rgw-go has ported (calibration.yaml sizes and
      coverage). The sizes are measured; coverage is an assumption with a stated range. Every estimate
      scaled from rgw-go to Ceph is inversely proportional to the coverage it is computed at; rgw-go's own
      measured cost is not, and in the reference scenario the written translation is but the single read
      of the source is not. The product Go counts its comment lines, a large
      share of its bytes (calibration.yaml sizes.rgw_go.product_go_comments), many of them citing the
      C++ they replace, so this is tokens written per source token ported, not a code-size ratio.
  test_ratio:
    value: 2.0760
    measured: true
    source: calibration.yaml
    reason: "Test and tooling Go rgw-go wrote per token of its product Go (calibration.yaml sizes.rgw_go)"   # (2,520,207 + 256,749) / 1,337,661 = 2.07598
  overhead:
    value: 10.939
    measured: true
    source: calibration.yaml
    # 45.01e6 / 4,114,617 = 10.9390
    reason: >-
      Output tokens rgw-go's port emitted per token of Go that survived, product, test and tooling
      (calibration.yaml measurement.port and sizes.rgw_go). It pays for review passes, rework and
      discarded drafts, and for the Markdown the port produced and kept (plans and registers,
      calibration.yaml sizes.rgw_go.markdown), which is not counted as surviving Go
  uncached_per_output:
    value: 0.007776
    measured: true
    source: calibration.yaml
    reason: "Uncached input tokens per output token in rgw-go's port (calibration.yaml measurement.port)"   # 0.35 / 45.01
  cache_write_per_output:
    value: 25.266
    measured: true
    source: calibration.yaml
    reason: "Cache-write tokens per output token in rgw-go's port (calibration.yaml measurement.port)"   # 1,137.2 / 45.01 = 25.2655
  cache_read_per_output:
    value: 1248.91
    measured: true
    source: calibration.yaml
    reason: "Cache-read tokens per output token in rgw-go's port (calibration.yaml measurement.port); an agent re-reads its context on every call"   # 56,213.6 / 45.01 = 1,248.914
  source_read_passes:
    value: 0
    measured: false
    source: assumption
    reason: "Extra uncached reads of the source per unit of work. Zero here because the three measured ratios above already hold all of rgw-go's input; the naive scenario sets it to 1"
  # ---- assumptions ----
  # Difficulty: each value is a relative judgement (config 0.1, glue 0.5,
  # standard 1, hard 1.5, extreme 2) divided by 1.1694, that scale's mean over
  # the source rgw-go ported (calibration.yaml ported_mix), so the model applied
  # to that source reproduces rgw-go's measured cost. Change a relative value in
  # ported_mix and divide again; cephest check fails until they agree.
  difficulty:
    config:   { value: 0.0855, measured: false, source: assumption, reason: "Configuration such as suite YAML is carried over almost mechanically. Its weight relative to the other classes is calibration.yaml ported_mix.relative_difficulty; this value is that weight divided by the relative scale's mean over the source rgw-go ported, so that the model applied to that source reproduces rgw-go's measured cost" }   # relative 0.1 / 1.1694
    glue:     { value: 0.4276, measured: false, source: assumption, reason: "Wiring, CLI plumbing and thin wrappers, which need much less reasoning than standard code. Its weight relative to the other classes is calibration.yaml ported_mix.relative_difficulty; this value is that weight divided by the relative scale's mean over the source rgw-go ported, so that the model applied to that source reproduces rgw-go's measured cost" }   # relative 0.5 / 1.1694
    standard: { value: 0.8551, measured: false, source: assumption, reason: "The anchor of the scale is the average of what rgw-go ported: S3 request handling together with the byte-compatible RADOS layout, bucket index and class clients. This value is standard code's relative weight (calibration.yaml ported_mix.relative_difficulty) divided by the relative scale's mean over that source, so that the model applied to it reproduces rgw-go's measured cost" }   # relative 1 / 1.1694
    hard:     { value: 1.2827, measured: false, source: assumption, reason: "Consensus, PG peering and recovery, erasure coding, MDS cache and locking, the messenger and wire encodings: concurrency-heavy or protocol-critical code that needs more review and rework per line. Its weight relative to the other classes is calibration.yaml ported_mix.relative_difficulty; this value is that weight divided by the relative scale's mean over the source rgw-go ported, so that the model applied to that source reproduces rgw-go's measured cost" }   # relative 1.5 / 1.1694
    extreme:  { value: 1.7103, measured: false, source: assumption, reason: "BlueStore and BlueFS allocators and on-disk formats, Crimson and SeaStore: code where a subtle bug loses data, or whose design rests on a runtime the target lacks. Its weight relative to the other classes is calibration.yaml ported_mix.relative_difficulty; this value is that weight divided by the relative scale's mean over the source rgw-go ported, so that the model applied to that source reproduces rgw-go's measured cost" }   # relative 2 / 1.1694
  rust_factor:
    value: 1.15
    measured: false
    source: assumption
    reason: "Guess: Rust needs more tokens than Go for the same logic (lifetimes, explicit error types, async plumbing). Nothing measures it; rgw-rs is too small a spike"
  wasm_overhead:
    value: 1.25
    measured: false
    source: assumption
    reason: >-
      Guess, applied uniformly to every feature on top of Rust. An adversarial review of this estimate
      (2026-11-14) reports that WASI lacks parallel threads, block devices and process execution, which
      would make shims and redesigns cost more; it rated those details plausible rather than confirmed,
      and no build for WASI was attempted to verify them. Host-side code that would stand in for what
      WASI cannot host is not costed
  clean_break_discount:
    value: 0.6
    measured: false
    source: assumption
    reason: "Guess. What was measured is the review role's share of the port row's cost at list prices (calibration.yaml derived.sanity_opus_5_5_usd.review_share, the measurement.roles row its role_scope names); the share spent on byte-exact formats and coexistence was not measured."
  long_cache_write_share:
    value: 0.0728
    measured: true
    source: calibration.yaml
    reason: "Share of rgw-go's cache-write tokens written at the 1-hour lifetime (calibration.yaml measurement_detail.cache_write_ttl_tokens); applied unchanged to other models' long lifetime (e.g. Astra's 12h)"   # 82,800,087 / 1,137,169,701 = 0.07281
  long_context_share:
    # Zero in the baseline. rgw-go's own shares (calibration.yaml
    # measurement_detail.prompt_size_tokens.share_over_threshold) are applied
    # by the scenarios listed in long_context_scenarios there.
    uncached:    { value: 0, measured: false, source: assumption, reason: "Share of uncached input in calls whose prompt exceeds a model's long-context threshold. An agent run against a price sheet that surcharges long prompts would be configured to stay under the threshold. The share measured on rgw-go (calibration.yaml measurement_detail.prompt_size_tokens.share_over_threshold), on a harness with a one-million-token window and no surcharge, is what a scenario applies when it takes prompts to be as long as rgw-go's; calibration.yaml measurement_detail.prompt_size_tokens.long_context_scenarios names those scenarios. Either way the token volumes are held fixed, which a different prompt size would not do" }
    cache_write: { value: 0, measured: false, source: assumption, reason: "Share of cache-write tokens in calls whose prompt exceeds a model's long-context threshold. An agent run against a price sheet that surcharges long prompts would be configured to stay under the threshold. The share measured on rgw-go (calibration.yaml measurement_detail.prompt_size_tokens.share_over_threshold), on a harness with a one-million-token window and no surcharge, is what a scenario applies when it takes prompts to be as long as rgw-go's; calibration.yaml measurement_detail.prompt_size_tokens.long_context_scenarios names those scenarios. Either way the token volumes are held fixed, which a different prompt size would not do" }
    cache_read:  { value: 0, measured: false, source: assumption, reason: "Share of cache-read tokens in calls whose prompt exceeds a model's long-context threshold. An agent run against a price sheet that surcharges long prompts would be configured to stay under the threshold. The share measured on rgw-go (calibration.yaml measurement_detail.prompt_size_tokens.share_over_threshold), on a harness with a one-million-token window and no surcharge, is what a scenario applies when it takes prompts to be as long as rgw-go's; calibration.yaml measurement_detail.prompt_size_tokens.long_context_scenarios names those scenarios. Either way the token volumes are held fixed, which a different prompt size would not do" }
    output:      { value: 0, measured: false, source: assumption, reason: "Share of output tokens in calls whose prompt exceeds a model's long-context threshold. An agent run against a price sheet that surcharges long prompts would be configured to stay under the threshold. The share measured on rgw-go (calibration.yaml measurement_detail.prompt_size_tokens.share_over_threshold), on a harness with a one-million-token window and no surcharge, is what a scenario applies when it takes prompts to be as long as rgw-go's; calibration.yaml measurement_detail.prompt_size_tokens.long_context_scenarios names those scenarios. Either way the token volumes are held fixed, which a different prompt size would not do" }
  model_efficiency:
    fable-5-2:   { value: 1.0, measured: false, source: assumption, reason: "No measurement of Fable 5.2's token use on this work; the same volumes are priced on its sheet. A model that needs more or less rework to reach the same result would cost more or less than shown" }
    opus-5-5:    { value: 1.0, measured: false, source: assumption, reason: "The calibration model, which ran the share of the port's calls recorded in calibration.yaml measurement.model_calls_share, so 1 by definition" }
    gpt-6-astra: { value: 1.0, measured: false, source: assumption, reason: "No measurement of GPT-6 Astra's token use on this work; the same volumes are priced on its sheet. A model that needs more or less rework to reach the same result would cost more or less than shown" }
    kimi-k3:     { value: 1.0, measured: false, source: assumption, reason: "No measurement of Kimi K3's token use on this work; the same volumes are priced on its sheet. A model that needs more or less rework to reach the same result would cost more or less than shown" }
  sloc_equivalent_bytes_per_line:
    value: 39.58
    measured: true
    source: data/generated/sloc.json
    # 44,558,059 B / 1,125,779 code lines = 39.5798
    reason: >-
      Bytes per code line of Ceph's own C++ in headline features of kind product, from
      data/generated/sloc.json through the taxonomy; cephest check recomputes it. A dependency's
      sloc_equivalent is in code lines, so each one carries the comments and blank lines real
      source does.
  adjacent_uplift:
    uncached:    { value: 0.1429, measured: false, source: calibration.yaml, reason: "Adjacent work (defect reproduction, security hook, PR servicing, feasibility) per unit of port work, in uncached input: the adjacent rows over the port row (calibration.yaml measurement). Only defect reproduction reported uncached input; the other three rows give none (\"—\" in the supplied table, counted as 0), so this is not a measurement of all four" }   # 0.05 / 0.35
    cache_write: { value: 0.1597, measured: true, source: calibration.yaml, reason: "Adjacent work (defect reproduction, security hook, PR servicing, feasibility) per unit of port work, in cache writes: the adjacent rows over the port row (calibration.yaml measurement)" }   # 181.6 / 1,137.2
    cache_read:  { value: 0.0955, measured: true, source: calibration.yaml, reason: "Adjacent work (defect reproduction, security hook, PR servicing, feasibility) per unit of port work, in cache reads: the adjacent rows over the port row (calibration.yaml measurement)" }   # 5,366.2 / 56,213.6
    output:      { value: 0.3208, measured: true, source: calibration.yaml, reason: "Adjacent work (defect reproduction, security hook, PR servicing, feasibility) per unit of port work, in output: the adjacent rows over the port row (calibration.yaml measurement)" }   # 14.44 / 45.01

toggles: { include_adjacent: false, clean_break: false }

# Scenarios in the order the report presents them. role: low, central, high or
# reference; one central scenario, which is default_scenario. A scale
# multiplies the baseline value, so a scaled path follows a re-measured
# baseline; an override replaces it. Some values are copies or functions of
# calibration.yaml, which says which scenario takes which: the overhead,
# cache_read_per_output and cache_write_per_output scales are a phase's ratio
# over all phases' (phases.scenario_phase), the expansion overrides are taken
# at a coverage end (coverage.scenario_end), and the long-context overrides are
# rgw-go's shares (measurement_detail.prompt_size_tokens.long_context_scenarios).
# cephest check recomputes each one and fails on a copied value in a scenario
# that is not mapped. After changing coverage, a bytes-per-token value, a phase
# row or rgw-go's shares, recompute every value check names, here and in
# calibration.yaml's derived figures.
scenarios:
  optimistic:
    label: Optimistic
    role: low
    description: >-
      Every feature costs what rgw-go's first implementation phase did per line, hard code is nearer to ordinary code than assumed, and rgw-go is taken at the top of its coverage range.
      The phase ratios are measured on rgw-go; that a whole port would sustain them, the difficulty and the coverage are assumptions.
    overrides:
      expansion: 1.2133                 # coverage 0.40: 1,337,661 / (2,756,184 × 0.40) = 1.21333
    scale:
      overhead: 0.8710                  # phase 1 ÷ all phases, output per Go token added: 9.4580 / 10.8589 = 0.87100
      cache_read_per_output: 0.8652     # phase 1 ÷ all phases: 1,080.81 / 1,249.20 = 0.86520
      cache_write_per_output: 0.7291    # phase 1 ÷ all phases: 18.4242 / 25.2698 = 0.72910
      difficulty.hard: 0.8333           # relative 1.5 → 1.25
      difficulty.extreme: 0.75          # relative 2 → 1.5
    toggles: {}
  calibrated:
    label: Scaled from rgw-go
    role: central
    description: >-
      The token ratios one real port showed (rgw-go, to Go, on Claude Opus 5.5, unfinished), applied to every Ceph feature.
      Measured on rgw-go: output tokens per token of surviving Go, its test ratio and the ratio of each kind of input to output; assumed: that input grows in proportion to output, the share of radosgw rgw-go covers, the difficulty of each feature, the Rust and WASM factors, and that other models need the tokens Opus 5.5 did.
    overrides: {}
    toggles: {}
  pessimistic:
    label: Pessimistic
    role: high
    description: >-
      Every feature costs what rgw-go's latest, review-heavier phase does per line, hard code is harder than assumed, rgw-go is taken at the low end of its coverage range, WASM needs a fifth more again, long prompts are billed at rgw-go's share where a price sheet surcharges them, and the work around the port (defect reproduction, security review, upstream PRs) is included.
      The phase ratios, the long-prompt shares and the adjacent work are measured on rgw-go; the difficulty, the coverage and the WASM factor are assumptions.
    overrides:
      expansion: 1.6178                 # coverage 0.30: 1,337,661 / (2,756,184 × 0.30) = 1.61777
      long_context_share.uncached: 0.550     # rgw-go's measured shares (calibration.yaml
      long_context_share.cache_write: 0.748  # measurement_detail.prompt_size_tokens
      long_context_share.cache_read: 0.797   # .share_over_threshold)
      long_context_share.output: 0.699
    scale:
      overhead: 1.1971                  # phase 2 ÷ all phases, output per Go token added: 12.9996 / 10.8589 = 1.19714
      cache_read_per_output: 1.1555     # phase 2 ÷ all phases: 1,443.49 / 1,249.20 = 1.15553
      cache_write_per_output: 1.2691    # phase 2 ÷ all phases: 32.0696 / 25.2698 = 1.26909
      difficulty.hard: 1.3333           # relative 1.5 → 2
      difficulty.extreme: 1.5           # relative 2 → 3
      wasm_overhead: 1.2                # 1.25 → 1.5
    toggles: { include_adjacent: true }
  naive:
    label: Naive single pass
    role: reference
    description: >-
      A reference point, not an outcome: what a "translate every line once" estimate would say, with one pass over the source, no new tests, no review and no re-reading.
      It is shown for scale against the other scenarios; nothing about porting Ceph this way has been measured.
    overrides:
      test_ratio: 0
      overhead: 1
      uncached_per_output: 0
      source_read_passes: 1            # the source is read once, uncached
      cache_write_per_output: 0
      cache_read_per_output: 0
      difficulty.config: 1
      difficulty.glue: 1
      difficulty.standard: 1
      difficulty.hard: 1
      difficulty.extreme: 1
      rust_factor: 1
      wasm_overhead: 1
    toggles: {}

default_scenario: calibrated
