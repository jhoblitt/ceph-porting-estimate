# dependencies.yaml — what a port does about each library Ceph leans on.
#
# One entry per vendored submodule (or group of them) and per significant
# system or Python dependency. For each target:
#   strategy         native   a maintained package in the target ecosystem (or its
#                             standard library) covers what Ceph uses; costs nothing
#                    bindings the library is kept and called through cgo/FFI
#                    port     the needed part is rewritten in the target language
#                    drop     a rewrite does not carry it, or the target cannot host it
#   package          the package, crate or binding relied on, where there is one
#   sloc_equivalent  lines of work the strategy leaves; this is what the model costs
#   difficulty       how hard that work is (same scale as the taxonomy)
#   note             the reasoning, including anything not verified
# wasm is a Rust port constrained to build for WASM/WASI.
dependencies:
  - id: rocksdb
    name: RocksDB
    used_for: BlueStore metadata KV store (via BlueFS/BlueRocksEnv) and monitor store
    submodules:
      - src/rocksdb
    targets:
      go:
        strategy: bindings
        package: github.com/linxGnu/grocksdb
        sloc_equivalent: 2500
        difficulty: hard
        note: grocksdb is a maintained cgo binding to the RocksDB library, which Ceph vendors as src/rocksdb
          and uses through src/kv/RocksDBStore.cc and BlueStore's BlueRocksEnv; ~2.5k lines of glue to
          expose a custom Env/FileSystem over BlueFS, merge operators and column-family sharding.
          cockroachdb/pebble is native but not RocksDB-format compatible with existing OSDs.
      rust:
        strategy: bindings
        package: rocksdb (rust-rocksdb)
        sloc_equivalent: 2500
        difficulty: hard
        note: Maintained binding (the rocksdb crate, rust-rocksdb) to the RocksDB library, which Ceph
          vendors as src/rocksdb and uses through src/kv/RocksDBStore.cc and BlueStore's BlueRocksEnv, but a
          custom Env/FileSystem for BlueFS is not exposed by the crate; ~2.5k lines of FFI glue to add it.
      wasm:
        strategy: native
        package: fjall
        sloc_equivalent: 0
        difficulty: hard
        note: RocksDB does not build for WASI (threads, mmap); a pure-Rust LSM (fjall, WASI support unverified)
          replaces it at the cost of on-disk compatibility, and BlueFS on raw block is lost.
  - id: seastar
    name: Seastar
    used_for: Shard-per-core async runtime for the Crimson OSD (futures, reactor, networking, DPDK/io_uring)
    submodules:
      - src/seastar
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: extreme
        note: Crimson async model maps to goroutines; no shard-per-core reactor is carried, the cost lives
          in the Crimson port itself.
      rust:
        strategy: native
        package: compio
        sloc_equivalent: 0
        difficulty: extreme
        note: compio, a maintained thread-per-core io_uring runtime, is the nearest equivalent (glommio
          has had no release since 2024-03); tokio is the conservative fallback.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: extreme
        note: No reactor or io_uring under WASI; Crimson would run on a single-threaded async executor
          with host-provided I/O.
  - id: spdk
    name: SPDK
    used_for: User-space NVMe driver backend for BlueStore (NVMEDevice)
    submodules:
      - src/spdk
    targets:
      go:
        strategy: bindings
        package: null
        sloc_equivalent: 1000
        difficulty: hard
        note: No maintained Go SPDK binding known; cgo glue over SPDK's NVMe driver (spdk/nvme.h, whose
          spdk_nvme_* functions BlueStore's NVMEDevice calls in src/blk/spdk/NVMEDevice.cc; vendored as
          src/spdk) for the ~1k-line NVMEDevice surface (probe, qpairs, submit/complete).
      rust:
        strategy: bindings
        package: null
        sloc_equivalent: 1000
        difficulty: hard
        note: No established crate, only young SPDK FFI crates first released in 2026 (ironspdk, spdk-io);
          ~1k lines of FFI glue over SPDK's NVMe driver (spdk/nvme.h, whose spdk_nvme_* functions
          BlueStore's NVMEDevice calls in src/blk/spdk/NVMEDevice.cc; vendored as src/spdk).
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: hard
        note: Kernel-bypass NVMe is impossible under WASI; capability lost.
  - id: isa-l
    name: Intel ISA-L
    used_for: Erasure-code plugin (isa) Reed-Solomon/Cauchy kernels
    submodules:
      - src/isa-l
    targets:
      go:
        strategy: port
        package: github.com/klauspost/reedsolomon
        sloc_equivalent: 400
        difficulty: hard
        note: klauspost/reedsolomon supplies SIMD GF(2^8) kernels; ISA-L matrix generation (gf_gen_rs/cauchy1)
          must be reproduced (~400 lines) for chunk compatibility and passed in via WithCustomMatrix.
      rust:
        strategy: port
        package: null
        sloc_equivalent: 1500
        difficulty: hard
        note: No usable crate (reed-solomon-erasure unmaintained since 2022; reed-solomon-simd uses
          GF(2^16) codes, not chunk-compatible); a GF(2^8) region-multiply core plus ISA-L matrix
          generation must be written.
      wasm:
        strategy: port
        package: null
        sloc_equivalent: 1500
        difficulty: hard
        note: Same port as Rust with scalar or wasm simd128 kernels; throughput well below AVX2/GFNI.
  - id: jerasure
    name: Jerasure + GF-Complete
    used_for: 'Erasure-code plugin (jerasure) techniques: reed_sol_van, reed_sol_r6_op, cauchy_orig/good,
      liberation, blaum_roth, liber8tion'
    submodules:
      - src/erasure-code/jerasure/jerasure
      - src/erasure-code/jerasure/gf-complete
    targets:
      go:
        strategy: port
        package: github.com/klauspost/reedsolomon
        sloc_equivalent: 5000
        difficulty: hard
        note: The WithJerasureMatrix option reproduces jerasure's reed_sol_van matrix only;
          Cauchy and bit-matrix techniques with their packet schedules must be ported bit-exact (~5k of
          jerasure.c/cauchy.c/liberation.c plus GF w8/w16/w32 paths).
      rust:
        strategy: port
        package: null
        sloc_equivalent: 5500
        difficulty: hard
        note: No crate implements jerasure bit-matrix techniques; port the jerasure core and the GF-Complete
          word sizes Ceph uses.
      wasm:
        strategy: port
        package: null
        sloc_equivalent: 5500
        difficulty: hard
        note: As Rust, scalar kernels only.
  - id: zstd
    name: Zstandard
    used_for: Compressor plugin (BlueStore, messenger and RGW compression)
    submodules:
      - src/zstd
    targets:
      go:
        strategy: native
        package: github.com/klauspost/compress/zstd
        sloc_equivalent: 0
        difficulty: glue
        note: Pure-Go encoder/decoder, maintained.
      rust:
        strategy: bindings
        package: zstd
        sloc_equivalent: 0
        difficulty: glue
        note: Maintained crate binding libzstd; ruzstd is a pure-Rust alternative.
      wasm:
        strategy: native
        package: ruzstd
        sloc_equivalent: 0
        difficulty: standard
        note: Pure Rust; decoder mature, encoder limited (coverage of the levels Ceph uses unverified);
          zstd-sys may also compile to wasm32-wasi (unverified).
  - id: xxhash
    name: xxHash
    used_for: BlueStore checksums (xxhash32/64) and RGW checksum digests
    submodules:
      - src/xxHash
    targets:
      go:
        strategy: native
        package: github.com/cespare/xxhash/v2
        sloc_equivalent: 0
        difficulty: glue
        note: Stable pure-Go XXH64 (feature-complete, no commits since 2024-07); XXH3 via zeebo/xxh3; no
          maintained XXH32 package exists, so XXH32 (~100 lines) is written in-tree.
      rust:
        strategy: native
        package: xxhash-rust
        sloc_equivalent: 0
        difficulty: glue
        note: Pure-Rust XXH32/64/3.
      wasm:
        strategy: native
        package: xxhash-rust
        sloc_equivalent: 0
        difficulty: glue
        note: Pure Rust, WASI-safe.
  - id: blake3
    name: BLAKE3
    used_for: RGW checksum algorithm (x-amz-checksum / cksum)
    submodules:
      - src/BLAKE3
    targets:
      go:
        strategy: native
        package: lukechampine.com/blake3
        sloc_equivalent: 0
        difficulty: glue
        note: Pure-Go implementation (last release 2025-05; zeebo/blake3 is a more recently active
          alternative).
      rust:
        strategy: native
        package: blake3
        sloc_equivalent: 0
        difficulty: glue
        note: Official crate.
      wasm:
        strategy: native
        package: blake3
        sloc_equivalent: 0
        difficulty: glue
        note: Official crate builds for wasm32.
  - id: isa-l-crypto
    name: Intel ISA-L crypto
    used_for: Accelerated AES (crypto plugin) for RGW server-side encryption
    submodules:
      - src/crypto/isa-l/isa-l_crypto
    targets:
      go:
        strategy: native
        package: crypto/aes
        sloc_equivalent: 0
        difficulty: glue
        note: Standard library AES uses AES-NI.
      rust:
        strategy: native
        package: aes / aes-gcm (RustCrypto)
        sloc_equivalent: 0
        difficulty: glue
        note: Hardware-accelerated where available.
      wasm:
        strategy: native
        package: aes / aes-gcm (RustCrypto)
        sloc_equivalent: 0
        difficulty: glue
        note: Software AES only; slower.
  - id: qat
    name: Intel QAT (qatlib, QATzip) and UADK
    used_for: Hardware offload for compression and encryption
    submodules:
      - src/qatlib
      - src/qatzip
    targets:
      go:
        strategy: bindings
        package: null
        sloc_equivalent: 600
        difficulty: standard
        note: No maintained Go binding known; ~600 lines of cgo over QATzip (qatzip.h, whose qzInit,
          qzSetupSessionDeflate, qzCompress and qzDecompress Ceph's QatAccel calls for the zlib compressor
          plugin; the lz4 plugin links QatAccel, but its init accepts only zlib) and the qatlib it runs on
          (src/qatzip, src/qatlib), mirroring QatAccel. Whether these lines also cover the QAT crypto plugin
          (src/crypto/qat, over qatlib's cpaCySymDp* API) is unverified. UADK is not bound. Ceph fetches it
          at build time from ceph/uadk, on aarch64 only (cmake/modules/Builduadk.cmake), and uses it only in
          the zlib compressor plugin's UadkAccel (libwd_comp); on those hosts the port compresses zlib in
          software, as Ceph does when uadk_compressor_enabled is off, its default.
      rust:
        strategy: bindings
        package: null
        sloc_equivalent: 600
        difficulty: standard
        note: No QAT or QATzip crate on crates.io; ~600 lines of FFI to QATzip (qatzip.h, whose qzInit,
          qzSetupSessionDeflate, qzCompress and qzDecompress Ceph's QatAccel calls for the zlib compressor
          plugin; the lz4 plugin links QatAccel, but its init accepts only zlib) and the qatlib it runs on
          (src/qatzip, src/qatlib), mirroring QatAccel. Whether these lines also cover the QAT crypto plugin
          (src/crypto/qat, over qatlib's cpaCySymDp* API) is unverified. UADK is not bound. Ceph fetches it
          at build time from ceph/uadk, on aarch64 only (cmake/modules/Builduadk.cmake), and uses it only in
          the zlib compressor plugin's UadkAccel (libwd_comp); on those hosts the port compresses zlib in
          software, as Ceph does when uadk_compressor_enabled is off, its default.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Hardware accelerator unavailable under WASI; capability lost.
  - id: fmt
    name: '{fmt}'
    used_for: C++ string formatting used throughout
    submodules:
      - src/fmt
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: fmt package covers it.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: format! covers it.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: format! covers it.
  - id: googletest
    name: GoogleTest / GoogleMock
    used_for: C++ unit-test framework
    submodules:
      - src/googletest
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: go test; gomock/testify for mocks.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: cargo test; mockall for mocks.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: cargo test under a WASI runtime.
  - id: breakpad
    name: Breakpad + linux-syscall-support
    used_for: Minidump crash reporting
    submodules:
      - src/breakpad
      - src/lss
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Go runtime tracebacks replace it.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Panic hooks and backtraces replace it.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Host runtime reports traps.
  - id: blkin
    name: blkin
    used_for: Zipkin-style trace annotations over LTTng (WITH_BLKIN, off by default)
    submodules:
      - src/blkin
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Superseded by OpenTelemetry.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Superseded by OpenTelemetry.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Superseded by OpenTelemetry.
  - id: opentelemetry
    name: OpenTelemetry C++
    used_for: Distributed tracing of OSD and RGW ops (jaeger tracing, WITH_JAEGER on)
    submodules:
      - src/jaegertracing/opentelemetry-cpp
    targets:
      go:
        strategy: native
        package: go.opentelemetry.io/otel
        sloc_equivalent: 0
        difficulty: glue
        note: Official SDK.
      rust:
        strategy: native
        package: opentelemetry
        sloc_equivalent: 0
        difficulty: glue
        note: Official crates.
      wasm:
        strategy: native
        package: opentelemetry
        sloc_equivalent: 0
        difficulty: standard
        note: API works on WASI; exporters need wasi-http or a host shim (unverified).
  - id: c-ares
    name: c-ares
    used_for: Async DNS resolution for Seastar/Crimson
    submodules:
      - src/c-ares
    targets:
      go:
        strategy: native
        package: net (Resolver)
        sloc_equivalent: 0
        difficulty: glue
        note: Standard library resolver.
      rust:
        strategy: native
        package: hickory-resolver
        sloc_equivalent: 0
        difficulty: glue
        note: Maintained async resolver.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: No raw DNS sockets assumed under WASI; resolution goes through the host (wasi-sockets ip-name-lookup).
  - id: s3select
    name: s3select
    used_for: RGW S3 Select SQL engine over CSV/JSON/Parquet (Ceph-authored, header-only, Boost.Spirit
      grammar)
    submodules:
      - src/s3select
    targets:
      go:
        strategy: port
        package: null
        sloc_equivalent: 11000
        difficulty: standard
        note: Ceph-specific SQL dialect and semantics; port parser, operators, functions and CSV/JSON
          readers (~11k lines); Parquet side via arrow-go.
      rust:
        strategy: port
        package: sqlparser
        sloc_equivalent: 9000
        difficulty: standard
        note: sqlparser-rs can replace the Spirit grammar (dialect fit unverified); evaluator, functions
          and readers are still ported.
      wasm:
        strategy: port
        package: sqlparser
        sloc_equivalent: 9000
        difficulty: standard
        note: As Rust; pure computation, WASI-friendly.
  - id: arrow-parquet
    name: Apache Arrow / Parquet (with Thrift, RE2, utf8proc)
    used_for: Parquet object reads for S3 Select; Arrow Flight in RGW (optional)
    submodules:
      - src/arrow
      - src/utf8proc
    targets:
      go:
        strategy: native
        package: github.com/apache/arrow-go/v18
        sloc_equivalent: 0
        difficulty: glue
        note: Includes parquet (module path carries the /v18 major suffix); utf8proc normalisation via
          golang.org/x/text.
      rust:
        strategy: native
        package: arrow + parquet (arrow-rs)
        sloc_equivalent: 0
        difficulty: glue
        note: Official Rust implementation.
      wasm:
        strategy: native
        package: arrow + parquet (arrow-rs)
        sloc_equivalent: 0
        difficulty: standard
        note: arrow-rs builds for wasm32 (some codecs feature-gated, unverified).
  - id: libkmip
    name: libkmip
    used_for: KMIP client for RGW SSE-KMS key retrieval
    submodules:
      - src/libkmip
    targets:
      go:
        strategy: native
        package: github.com/ovh/kmip-go
        sloc_equivalent: 0
        difficulty: standard
        note: Maintained pure-Go KMIP client; ThalesGroup/kmip-go (formerly gemalto) is an alternative.
      rust:
        strategy: port
        package: null
        sloc_equivalent: 1500
        difficulty: standard
        note: kmip-protocol exists but is a self-described work-in-progress partial KMIP 1.0-1.2 client,
          so it is not relied on; port TTLV encode/decode plus the Locate/Get/Create operations Ceph uses
          (~1.5k lines).
      wasm:
        strategy: port
        package: null
        sloc_equivalent: 1500
        difficulty: standard
        note: As Rust; TLS socket via wasi-sockets or a host shim.
  - id: librdkafka
    name: librdkafka
    used_for: Kafka push endpoint for RGW bucket notifications
    submodules:
      - src/librdkafka
    targets:
      go:
        strategy: native
        package: github.com/twmb/franz-go
        sloc_equivalent: 0
        difficulty: glue
        note: Pure-Go client; confluent-kafka-go is the cgo alternative.
      rust:
        strategy: bindings
        package: rdkafka
        sloc_equivalent: 0
        difficulty: glue
        note: Maintained binding to librdkafka, the C client RGW's Kafka push endpoint calls through
          librdkafka/rdkafka.h (src/rgw/rgw_kafka.cc) and Ceph vendors as src/librdkafka. Whether the crate
          builds its own copy or links Ceph's is unverified.
      wasm:
        strategy: port
        package: rskafka
        sloc_equivalent: 800
        difficulty: standard
        note: librdkafka does not target WASI; pure-Rust rskafka (SASL/TLS coverage unverified) plus producer
          glue.
  - id: lancedb
    name: LanceDB C bindings
    used_for: Vector index store backing RGW S3 Vectors (optional)
    submodules:
      - src/rgw/lancedb-c
    targets:
      go:
        strategy: bindings
        package: github.com/lancedb/lancedb-go
        sloc_equivalent: 500
        difficulty: standard
        note: A pre-1.0 official Go SDK (cgo over a prebuilt native library) exists; its coverage of what S3
          Vectors needs is unchecked, so ~500 lines of cgo glue are kept as the estimate.
      rust:
        strategy: native
        package: lancedb
        sloc_equivalent: 0
        difficulty: glue
        note: LanceDB is written in Rust; use the crate directly.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: standard
        note: LanceDB on WASI unverified (threads, object-store I/O); feature lost or host-shimmed.
  - id: rook-client-python
    name: rook-client-python
    used_for: Generated Python types for Rook CRDs used by mgr/rook
    submodules:
      - src/pybind/mgr/rook/rook-client-python
    targets:
      go:
        strategy: native
        package: github.com/rook/rook/pkg/apis
        sloc_equivalent: 0
        difficulty: glue
        note: Rook publishes Go API types; use with client-go.
      rust:
        strategy: native
        package: kube + kopium-generated types
        sloc_equivalent: 0
        difficulty: glue
        note: Types generated from the CRDs, not hand-written.
      wasm:
        strategy: native
        package: kube + kopium-generated types
        sloc_equivalent: 0
        difficulty: standard
        note: kube-rs transport on WASI needs wasi-http (unverified).
  - id: nvmeof-gateway
    name: ceph-nvmeof gateway
    used_for: Separate NVMe-oF gateway project (Python + SPDK) carried for builds and containers
    submodules:
      - src/nvmeof/gateway
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Separate product reached over gRPC; not part of a Ceph core port.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Separate product reached over gRPC.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Separate product; SPDK not hostable.
  - id: test-corpora
    name: ceph-object-corpus and ceph-erasure-code-corpus
    used_for: Encoded-object and EC-chunk corpora for encoding non-regression tests
    submodules:
      - ceph-object-corpus
      - ceph-erasure-code-corpus
    targets:
      go:
        strategy: native
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: 'Data, not code: reused unchanged to prove the port decodes existing encodings.'
      rust:
        strategy: native
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Data reused unchanged.
      wasm:
        strategy: native
        package: null
        sloc_equivalent: 0
        difficulty: glue
        note: Data reused unchanged.
  - id: boost-asio-beast
    name: Boost.Asio / Boost.Beast
    used_for: Async I/O for neorados, RGW Beast HTTP frontend, timers and strands
    submodules: []
    targets:
      go:
        strategy: native
        package: net, net/http
        sloc_equivalent: 0
        difficulty: standard
        note: Goroutines plus net/http replace Asio/Beast; RGW frontend semantics are re-expressed, not
          bound.
      rust:
        strategy: native
        package: tokio + hyper
        sloc_equivalent: 0
        difficulty: standard
        note: Maintained async runtime and HTTP stack.
      wasm:
        strategy: native
        package: wstd / wasi-http
        sloc_equivalent: 0
        difficulty: hard
        note: WASI p2 provides HTTP and sockets via the host; a server frontend must be hosted by the
          runtime (maturity unverified).
  - id: boost-context-coroutine
    name: Boost.Context / Coroutine / spawn
    used_for: Stackful coroutines for RGW request handling (optional_yield) and async helpers
    submodules: []
    targets:
      go:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: standard
        note: Goroutines are stackful; yield contexts disappear.
      rust:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: standard
        note: async/await replaces stackful coroutines; call sites are restructured in the RGW port.
      wasm:
        strategy: drop
        package: null
        sloc_equivalent: 0
        difficulty: standard
        note: async/await on a single-threaded executor.
  - id: boost-misc
    name: Boost (program_options, regex, date_time, iostreams, url, container, intrusive, lockfree, random,
      spirit, etc.)
    used_for: General utilities across all daemons; Spirit grammars in json_spirit and s3select
    submodules: []
    targets:
      go:
        strategy: native
        package: standard library (flag, regexp, time, net/url) + spf13/pflag
        sloc_equivalent: 0
        difficulty: glue
        note: Equivalents in the standard library or common packages; Spirit grammars are rewritten with
          the code that uses them.
      rust:
        strategy: native
        package: std + clap, regex, chrono, url, smallvec, crossbeam
        sloc_equivalent: 0
        difficulty: glue
        note: Maintained crates cover each component.
      wasm:
        strategy: native
        package: std + clap, regex, chrono, url, smallvec
        sloc_equivalent: 0
        difficulty: glue
        note: All pure Rust; lock-free/threaded pieces become single-threaded.
  - id: openssl
    name: OpenSSL
    used_for: TLS (RGW frontend, HTTP clients), msgr2 AES-GCM, hashing (MD5/SHA/HMAC) in ceph_crypto and
      RGW auth
    submodules: []
