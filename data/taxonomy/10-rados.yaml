# Group: RADOS core (g1). Source ceph@ec322a5e95ebcb46dec7d6a9d7813a34543c64ad
components:
  - id: osd
    group: rados
    name: OSD (classic)
    description: The classic object storage daemon - PG state machines, replication, EC, recovery and scrub.
    root: src/osd/
    features:
      - id: op-execution
        name: Object op execution (PrimaryLogPG)
        description: Executes client RADOS ops against objects on the primary - reads, writes, omap, xattrs, class calls, copy-from, snaps.
        globs: [src/osd/PrimaryLogPG.*, src/osd/PGTransaction.h, src/osd/osd_op_util.*, src/osd/OpRequest.*, src/osd/object_state*, src/osd/osd_internal_types.h, src/osd/ObjectVersioner.h]
        scope: headline
        kind: product
        difficulty: hard
        why: PrimaryLogPG.cc (18.6k lines) is the op interpreter; it is entangled with recovery, snap and object-context locking semantics that clients depend on bit-for-bit.
      - id: peering-recovery
        name: PG peering and recovery
        description: PG lifecycle state machine - peering, activation, missing-set tracking, recovery and backfill orchestration.
        globs: [src/osd/PeeringState.*, src/osd/PGPeeringEvent.*, src/osd/PGStateUtils.*, src/osd/MissingLoc.*, src/osd/recovery_types.h, src/osd/PG.*, src/osd/pg_features.h]
        scope: headline
        kind: product
        difficulty: hard
        why: PeeringState is the boost::statechart peering protocol and PG.cc drives recovery/backfill - named "hard" in the brief.
      - id: pg-log
        name: PG log
        description: Per-PG operation log used for peering, divergent-entry rollback and log-based recovery.
        globs: [src/osd/PGLog.*]
        scope: headline
        kind: product
        difficulty: hard
        why: On-disk log format plus merge/divergence logic central to peering correctness.
      - id: replicated-backend
        name: Replicated backend
        description: PGBackend abstraction and the replicated implementation of sub-op fan-out and push/pull recovery.
        globs: [src/osd/ReplicatedBackend.*, src/osd/PGBackend.*]
        scope: headline
        kind: product
        difficulty: hard
        why: Replication write path and push/pull recovery messages; on-wire sub-op semantics must match peers.
      - id: erasure-coding
        name: Erasure-coded pools
        description: EC backend - stripe layout, read/modify/write pipeline, extent cache, omap journal, legacy (L) and optimized paths.
        globs: [src/osd/EC*]
        scope: headline
        kind: product
        difficulty: hard
        why: All src/osd/EC* files implement EC pools (two parallel generations, ECSwitch selects); EC is named "hard" in the brief.
      - id: scrub
        name: Scrub and deep-scrub
        description: Scrub scheduling, reservations, chunked map comparison, inconsistency store and repair.
        globs: [src/osd/scrubber/**, src/osd/scrubber_common.h]
        scope: headline
        kind: product
        difficulty: hard
        why: Distributed statechart with replica reservations and object-map comparison; correctness affects data integrity.
      - id: op-scheduler
        name: Op scheduler (mClock QoS)
        description: OSD op queue abstraction and the mClock-based QoS scheduler integration.
        globs: [src/osd/scheduler/**]
        scope: headline
        kind: product
        difficulty: standard
        why: A queue abstraction and profile wiring over the dmclock library; algorithmic core lives in src/dmclock.
      - id: osd-daemon
        name: OSD daemon core
        description: OSD service - sharded op dispatch, map handling, PG creation/split/merge, heartbeats, admin commands, perf counters.
        globs: [src/osd/OSD.*, src/osd/Session.*, src/osd/osd_perf_counters.*, src/osd/DynamicPerfStats.h, src/osd/osd_tracer.*, src/osd/error_code.*, src/osd/Coroutines.h]
        scope: headline
        kind: product
        difficulty: hard
        why: OSD.cc (11.9k lines) couples sharded queues, osdmap epoch catch-up, heartbeat failure detection and PG split/merge.
      - id: osdmap
        name: OSDMap and placement mapping
        description: OSDMap encoding, incrementals, pg-to-OSD mapping, upmap balancing helpers and precomputed mappings.
        globs: [src/osd/OSDMap.*, src/osd/OSDMapMapping.*]
        scope: headline
        kind: product
        difficulty: hard
        why: Versioned on-wire map encoding shared by every client and daemon; placement must match CRUSH exactly.
      - id: osd-types
        name: OSD wire/disk types
        description: pg_t, object_info_t, pg_info_t, pg_stat_t, pool_opts and other versioned encodings shared cluster-wide.
        globs: [src/osd/osd_types.*, src/osd/osd_types_fmt.h]
        scope: headline
        kind: product
        difficulty: hard
        why: 15.6k lines of versioned encode/decode for on-wire and on-disk structures - "hard" per the brief.
      - id: snapshots
        name: Snapshot mapping and trimming
        description: SnapMapper - on-disk snap-to-object index driving snap trimming.
        globs: [src/osd/SnapMapper.*, src/osd/SnapMapReaderI.h]
        scope: headline
        kind: product
        difficulty: standard
        why: Self-contained key-value index with legacy-format conversion; moderate logic.
      - id: cache-tiering
        name: Cache tiering and HitSets
        description: HitSet tracking (bloom/explicit) and tiering-agent state for cache pools.
        globs: [src/osd/HitSet.*, src/osd/BloomHitSet.h, src/osd/ExplicitObjectHitSet.h, src/osd/ExplicitHashHitSet.h, src/osd/TierAgentState.h]
        scope: headline
        kind: product
        difficulty: standard
        why: Small, isolated data structures for a deprecated feature; agent logic itself is in PrimaryLogPG.
      - id: caps-and-classes
        name: OSD caps and object-class host
        description: OSD capability grammar/enforcement, dynamic cls plugin loading and the objclass host API implementation.
        globs: [src/osd/OSDCap.*, src/osd/ClassHandler.*, src/osd/objclass.cc]
        scope: headline
        kind: product
        difficulty: standard
        why: Cap parser (boost::spirit) plus dlopen-based class loading and the cls_cxx_* host callbacks.
      - id: watch-notify
        name: Watch/notify
        description: Object watch registration, notify fan-out, timeouts and reconnect handling on the OSD.
        globs: [src/osd/Watch.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Self-contained session/timer bookkeeping behind the watch and notify ops.
      - id: build
        name: Build files
        description: CMake build rules.
        globs: [src/osd/CMakeLists.txt]
        scope: not-ported
        kind: config
        difficulty: config
        why: Build plumbing is replaced, not ported.
      - id: other
        name: Other
        description: Remaining OSD files.
        globs: [src/osd/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Catch-all.
  - id: crimson-seastore
    group: crimson
    name: SeaStore
    description: Crimson's native log-structured object store for NVMe/ZNS - transactional extent cache, btrees, journal and cleaner.
    root: src/crimson/os/seastore/
    features:
      - id: store-frontend
        name: SeaStore ObjectStore front-end
        description: FuturizedStore implementation - transaction decoding, collection/object ops, mount/mkfs, root block.
        globs: [src/crimson/os/seastore/seastore.*, src/crimson/os/seastore/root_block.*, src/crimson/os/seastore/root_meta.h, src/crimson/os/seastore/logging.h, src/crimson/os/seastore/ordering_handle.h, src/crimson/os/seastore/seastore_dma_alloc.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Entry point that maps ObjectStore transactions onto the transaction manager; SeaStore is "extreme" per the brief.
      - id: on-disk-types
        name: SeaStore on-disk types
        description: paddr/laddr, extent types, record and delta encodings, segment and journal headers.
        globs: [src/crimson/os/seastore/seastore_types.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: 5.2k lines defining the on-disk address space and record formats every other SeaStore part encodes against.
      - id: transaction-cache
        name: Transaction manager and extent cache
        description: Optimistic transactions, cached-extent lifecycle, conflict detection, extent pinboard (2Q/LRU) and parent/child extent linkage.
        globs: [src/crimson/os/seastore/transaction_manager.*, src/crimson/os/seastore/transaction.h, src/crimson/os/seastore/transaction_interruptor.*, src/crimson/os/seastore/cache.*, src/crimson/os/seastore/cached_extent.*, src/crimson/os/seastore/extent_pinboard.*, src/crimson/os/seastore/linked_tree_node.h, src/crimson/os/seastore/logical_child_node.h, src/crimson/os/seastore/retired_extent_placeholder.h]
        scope: headline
        kind: product
        difficulty: extreme
        why: The concurrency-control and caching core; interacts with every extent type and the journal replay path.
      - id: lba-backref
        name: LBA and backref btrees
        description: Fixed-KV btree framework plus the logical-block-address and back-reference trees built on it.
        globs: [src/crimson/os/seastore/btree/**, src/crimson/os/seastore/lba/**, src/crimson/os/seastore/lba_manager.*, src/crimson/os/seastore/lba_mapping.*, src/crimson/os/seastore/backref/**, src/crimson/os/seastore/backref_manager.*, src/crimson/os/seastore/backref_entry.h, src/crimson/os/seastore/backref_mapping.h]
        scope: headline
        kind: product
        difficulty: extreme
        why: Copy-on-write on-disk btrees with in-memory linkage to cached extents.
      - id: onode-tree
        name: Onode tree (staged FLTree)
        description: Staged fixed-layout tree indexing object onodes by ghobject key.
        globs: [src/crimson/os/seastore/onode_manager/**, src/crimson/os/seastore/onode_manager.h, src/crimson/os/seastore/onode.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Heavily templated multi-stage node layout with delta-replay - the densest code in SeaStore.
      - id: omap
        name: Omap manager
        description: Per-object key/value storage - btree omap and the log-structured omap manager.
        globs: [src/crimson/os/seastore/omap_manager/**, src/crimson/os/seastore/omap_manager.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Two on-disk omap formats with string-KV node layouts.
      - id: object-data
        name: Object data handler
        description: Maps object byte ranges to logical extents - read, overwrite, zero, truncate, clone.
        globs: [src/crimson/os/seastore/object_data_handler.*, src/crimson/os/seastore/laddr_interval_set.h]
        scope: headline
        kind: product
        difficulty: extreme
        why: Extent split/merge and partial-overwrite logic on top of the LBA.
      - id: collections
        name: Collection manager
        description: Flat collection index for SeaStore.
        globs: [src/crimson/os/seastore/collection_manager/**, src/crimson/os/seastore/collection_manager.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Small on-disk structure but bound to the same extent/transaction model.
      - id: journal
        name: Journal
        description: Segmented and circular-bounded journals, record submission/batching and replay scanning.
        globs: [src/crimson/os/seastore/journal.*, src/crimson/os/seastore/journal/**, src/crimson/os/seastore/record_scanner.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Write-ahead record format and crash replay; on-disk compatibility critical.
      - id: cleaner-placement
        name: Cleaner and extent placement
        description: Async segment/RBM cleaner, generational extent placement, hot/cold tiering and space accounting.
        globs: [src/crimson/os/seastore/async_cleaner.*, src/crimson/os/seastore/extent_placement_manager.*, src/crimson/os/seastore/segment_seq_allocator.h, src/crimson/os/seastore/logical_bucket.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Log-structured GC with reclaim policies; deeply coupled to cache and backrefs.
      - id: segment-devices
        name: Segment managers and device layer
        description: Block, ZNS (zbd) and ephemeral segment managers, device abstraction, block/SPDK I/O drivers.
        globs: [src/crimson/os/seastore/segment_manager/**, src/crimson/os/seastore/segment_manager.*, src/crimson/os/seastore/segment_manager_group.*, src/crimson/os/seastore/device.*, src/crimson/os/seastore/block_io_driver.*, src/crimson/os/seastore/spdk_*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Direct device I/O including zoned-block and SPDK paths, with on-disk superblocks.
      - id: random-block-manager
        name: Random block manager
        description: RBM for conventional NVMe - AVL extent allocator, NVMe/HDD device drivers and block RB manager.
        globs: [src/crimson/os/seastore/random_block_manager/**, src/crimson/os/seastore/random_block_manager.*, src/crimson/os/seastore/randomblock_manager_group.h]
        scope: headline
        kind: product
        difficulty: extreme
        why: Allocator plus raw NVMe command paths - allocators and on-disk formats are "extreme".
      - id: build
        name: Build files
        description: CMake build rules.
        globs: [src/crimson/os/seastore/CMakeLists.txt]
        scope: not-ported
        kind: config
        difficulty: config
        why: Build plumbing is replaced, not ported.
      - id: other
        name: Other
        description: Remaining SeaStore files.
        globs: [src/crimson/os/seastore/**]
        scope: headline
        kind: product
        difficulty: extreme
        why: Catch-all.
  - id: crimson
    group: crimson
    name: Crimson OSD
    description: Seastar-based next-generation OSD - shard-per-core futures runtime, messenger, PG engine and store adapters (SeaStore is its own component).
    root: src/crimson/
    features:
      - id: op-execution
        name: Client op execution
        description: Crimson op executor, PG backend object ops, object contexts/locking, class calls, watch/notify and client request pipeline.
        globs: [src/crimson/osd/ops_executer.*, src/crimson/osd/pg_backend.*, src/crimson/osd/objclass.cc, src/crimson/osd/object_context*, src/crimson/osd/object_metadata_helper.*, src/crimson/osd/exceptions.h, src/crimson/osd/watch*, src/crimson/osd/osd_operations/client_request.*, src/crimson/osd/osd_operations/internal_client_request.*, src/crimson/osd/osd_operations/osdop_params.h]
        scope: headline
        kind: product
        difficulty: extreme
        why: Re-implementation of PrimaryLogPG semantics on interruptible futures; Crimson is "extreme" per the brief.
      - id: pg-peering
        name: PG lifecycle and peering glue
        description: Crimson PG, PG map, map advancement and the event operations that drive the shared PeeringState.
        globs: [src/crimson/osd/pg.*, src/crimson/osd/pg_map.*, src/crimson/osd/pg_meta.*, src/crimson/osd/pg_activation_blocker.*, src/crimson/osd/pg_interval_interrupt_condition.*, src/crimson/osd/osdmap_gate.*, src/crimson/osd/osdmap_service.h, src/crimson/osd/osd_operations/peering_event.*, src/crimson/osd/osd_operations/pg_advance_map.*, src/crimson/osd/osd_operations/pgpct_request.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Hosts the classic PeeringState inside a futures-based, interval-interruptible execution model.
      - id: recovery-backfill
        name: Recovery and backfill
        description: Crimson recovery backends (replicated, EC), backfill state machine and background recovery operations.
        globs: [src/crimson/osd/pg_recovery*, src/crimson/osd/recovery_backend.*, src/crimson/osd/replicated_recovery_backend.*, src/crimson/osd/ec_recovery_backend.*, src/crimson/osd/backfill_*, src/crimson/osd/osd_operations/background_recovery.*, src/crimson/osd/osd_operations/recovery_subrequest.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Recovery/backfill is "hard" in classic and is rewritten here on Seastar futures.
      - id: replication-ec
        name: Replicated and EC backends
        description: Replica write fan-out, EC sub-ops, log-missing and repop request/reply operations.
        globs: [src/crimson/osd/replicated_backend.*, src/crimson/osd/ec_backend.*, src/crimson/osd/acked_peers.h, src/crimson/osd/osd_operations/replicated_request*, src/crimson/osd/osd_operations/ecrep_request.*, src/crimson/osd/osd_operations/logmissing_request*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Wire-compatible replication and EC sub-op paths in the Crimson runtime.
      - id: scrub
        name: Scrub
        description: Crimson scrubber state machine, chunk validator and scrub event operations.
        globs: [src/crimson/osd/scrub/**, src/crimson/osd/osd_operations/scrub_events.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Independent re-implementation of scrub for Crimson.
      - id: snap-trim
        name: Snap trimming
        description: Background snap-trim and snap-trim-obj-subop operations.
        globs: [src/crimson/osd/osd_operations/snaptrim_event.*]
        scope: headline
        kind: product
        difficulty: extreme
        why: Snapshot removal pipeline driven by SnapMapper inside Crimson's op model.
      - id: osd-daemon
        name: OSD daemon, sharding and scheduling
        description: Crimson OSD service, per-core shard services, PG-to-shard routing, heartbeat, op tracking, startup and mClock scheduler.
        globs: [src/crimson/osd/osd.*, src/crimson/osd/main*, src/crimson/osd/shard_services.*, src/crimson/osd/pg_shard_manager.*, src/crimson/osd/heartbeat.*, src/crimson/osd/osd_meta.*, src/crimson/osd/state.h, src/crimson/osd/stop_signal.h, src/crimson/osd/osd_connection_priv.h, src/crimson/osd/osd_operation.*, src/crimson/osd/osd_operation_external_tracking.h, src/crimson/osd/lsan_suppressions.cc, src/crimson/osd/scheduler/**]
        scope: headline
        kind: product
        difficulty: extreme
        why: Shared-nothing per-core design with cross-shard PG routing has no classic analogue.
      - id: messenger
        name: Crimson messenger (msgr2 on Seastar)
        description: Seastar socket messenger implementing the msgr2 protocol, frame assembly and per-core connection I/O handlers.
        globs: [src/crimson/net/**]
        scope: headline
        kind: product
        difficulty: extreme
        why: msgr2 protocol re-implemented with cross-core connection handoff; the messenger is already "hard" in classic.
      - id: futures-runtime
        name: Crimson futures and common runtime
        description: Errorator and interruptible-future machinery, operation/blocker tracking, tri-mutex, LRU caches, Seastar config/log/perf glue.
        globs: [src/crimson/common/**]
        scope: headline
        kind: product
        difficulty: extreme
        why: Template-heavy error-typed futures with no direct Go/Rust analogue; everything in Crimson is built on it.
      - id: store-adapters
        name: Futurized store, AlienStore and CyanStore
        description: FuturizedStore interface, AlienStore (BlueStore on alien threads) and CyanStore (in-memory test store).
        globs: [src/crimson/os/futurized_*, src/crimson/os/alienstore/**, src/crimson/os/cyanstore/**]
        scope: headline
        kind: product
        difficulty: hard
        why: Interface adapters and a simple memory store; AlienStore's thread-pool bridging is the tricky part.
      - id: cluster-clients
        name: Mon, mgr and auth clients
        description: Seastar MonClient, MgrClient, auth client/server interfaces, keyring and CRUSH location.
        globs: [src/crimson/mon/**, src/crimson/mgr/**, src/crimson/auth/**, src/crimson/crush/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Client protocol re-implementations over the Crimson messenger; protocol logic is moderate.
      - id: admin
        name: Admin socket and commands
        description: Seastar admin socket server and OSD/PG admin commands.
        globs: [src/crimson/admin/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Command dispatch and JSON formatting.
      - id: tools
        name: Crimson tools
        description: crimson objectstore tool, store-bench, store-nbd and messenger/fltree perf harnesses.
        globs: [src/crimson/tools/**]
        scope: headline
        kind: product
        difficulty: glue
        why: CLI tools and benchmarks driving the store and messenger APIs.
      - id: build
        name: Build files
        description: CMake build rules.
        globs: [src/crimson/CMakeLists.txt, src/crimson/admin/CMakeLists.txt, src/crimson/osd/CMakeLists.txt, src/crimson/os/CMakeLists.txt, src/crimson/os/alienstore/CMakeLists.txt, src/crimson/os/cyanstore/CMakeLists.txt, src/crimson/tools/CMakeLists.txt]
        scope: not-ported
        kind: config
        difficulty: config
        why: Build plumbing is replaced, not ported.
      - id: other
        name: Other
        description: Remaining Crimson files.
        globs: [src/crimson/**]
        scope: headline
        kind: product
        difficulty: extreme
        why: Catch-all.
  - id: mon
    group: rados
    name: Monitor
    description: ceph-mon - Paxos-replicated cluster maps, elections, and the per-map PaxosServices; also the MonClient library.
    root: src/mon/
    features:
      - id: paxos
        name: Paxos and PaxosService framework
        description: Paxos consensus, lease handling, the PaxosService base for replicated maps, and the MonitorDBStore transaction layer.
        globs: [src/mon/Paxos.*, src/mon/PaxosService.*, src/mon/PaxosMap.h, src/mon/PaxosFSMap.h, src/mon/MonitorDBStore.h]
        scope: headline
        kind: product
        difficulty: hard
        why: Consensus (Paxos) is "hard" per the brief; on-disk store layout must stay compatible for upgrades.
      - id: elections
        name: Elections and connectivity tracking
        description: Elector, classic/disallowed/connectivity election strategies and peer connection scoring.
        globs: [src/mon/Elector.*, src/mon/ElectionLogic.*, src/mon/ConnectionTracker.*]
        scope: headline
        kind: product
        difficulty: hard
        why: Leader election and quorum formation; subtle liveness/safety behaviour, encoded score exchange.
      - id: monitor-core
        name: Monitor daemon core
        description: Monitor bootstrap, probing, store sync, quorum features, session/subscription handling, command routing and backup.
        globs: [src/mon/Monitor.*, src/mon/MonOpRequest.h, src/mon/Session.h, src/mon/MonSub.*, src/mon/mon_types.h, src/mon/MonitorBackup.*, src/mon/CommandHandler.*, src/mon/error_code.*, src/mon/MonCommand.h]
        scope: headline
        kind: product
        difficulty: hard
        why: Monitor.cc (7.4k lines) owns probe/sync/quorum state transitions tightly bound to Paxos.
      - id: osd-monitor
        name: OSDMonitor
        description: Authority for the OSDMap - failure reports, pool and CRUSH commands, upmap, PG creation tracking, incremental proposals.
        globs: [src/mon/OSDMonitor.*, src/mon/CreatingPGs.h]
        scope: headline
        kind: product
        difficulty: hard
        why: 18k lines that mint OSDMap epochs; correctness of map deltas and failure handling is cluster-critical.
      - id: pg-stats
        name: PGMap and stats aggregation
        description: PGMap digest, pool/OSD usage statistics, PG-state health summaries and the MgrStatMonitor that receives them.
        globs: [src/mon/PGMap.*, src/mon/MgrStatMonitor.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Aggregation and reporting logic with versioned encodings of the digest.
      - id: auth-monitor
        name: AuthMonitor and mon caps
        description: Cluster key database, entity/caps commands, global_id allocation and MonCap grammar.
        globs: [src/mon/AuthMonitor.*, src/mon/MonCap.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Keyring CRUD plus a boost::spirit cap parser.
      - id: fs-monitor
        name: MDSMonitor and fs commands
        description: FSMap authority - MDS beacons, failover, standby assignment and `ceph fs` commands.
        globs: [src/mon/MDSMonitor.*, src/mon/FSCommands.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Service logic over FSMap; failover policy is moderately intricate.
      - id: mgr-monitor
        name: MgrMonitor and MgrMap
        description: Active/standby mgr selection, module enablement and the MgrMap encoding.
        globs: [src/mon/MgrMonitor.*, src/mon/MgrMap.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Beacon-driven failover and map bookkeeping.
      - id: config-kv
        name: Config and config-key store
        description: Centralized config database (ConfigMonitor/ConfigMap with masks) and the KVMonitor config-key store.
        globs: [src/mon/ConfigMonitor.*, src/mon/ConfigMap.*, src/mon/KVMonitor.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Option storage with section/mask resolution - conventional service logic.
      - id: health-log
        name: Health and cluster log
        description: HealthMonitor checks/mutes, health_check types, and LogMonitor cluster log persistence.
        globs: [src/mon/HealthMonitor.*, src/mon/health_check.h, src/mon/LogMonitor.*]
        scope: headline
        kind: product
        difficulty: standard
        why: Aggregation, muting and log channel storage.
      - id: monmap
        name: MonMap and MonmapMonitor
