          - src/mds/flock.*
        scope: headline
        kind: product
        difficulty: hard
        why: Brief names MDS locking as hard; the lock-state tables and cap protocol define client-visible coherence semantics.
      - id: journaling
        name: Metadata journal (MDLog)
        description: MDLog segments and trimming, journal pointer, the LogEvent family (EMetaBlob, EUpdate, ...) and their replay.
        globs:
          - src/mds/MDLog.*
          - src/mds/LogEvent.*
          - src/mds/LogSegment*
          - src/mds/journal.cc
          - src/mds/events/**
          - src/mds/JournalPointer.*
          - src/mds/SegmentBoundary.h
        scope: headline
        kind: product
        difficulty: hard
        why: Brief names MDS journaling as hard; event encodings are on-disk formats that replay must honour exactly.
      - id: request-handling
        name: Client request handling (Server)
        description: Handles client metadata ops (lookup, create, rename, setattr, ...), peer requests between ranks, mutations and batching.
        globs:
          - src/mds/Server.*
          - src/mds/Mutation.*
          - src/mds/BatchOp.*
          - src/mds/MDSMetaRequest.h
