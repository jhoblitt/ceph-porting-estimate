# Group 2: gateways and filesystems taxonomy fragment
# Ceph commit ec322a5e95ebcb46dec7d6a9d7813a34543c64ad
components:
  - id: rgw
    group: rgw
    name: RADOS Gateway (API plane)
    description: The radosgw object gateway's request plane - HTTP frontends, S3/Swift APIs, auth, IAM, SSE, notifications, lifecycle and the SAL abstraction.
    root: src/rgw/
    features:
      - id: http-frontends
        name: HTTP frontends and request processing
        description: Beast/asio HTTP server, client I/O filters, request dispatch loop, outbound HTTP client, daemon startup.
        globs:
          - src/rgw/rgw_asio_*
          - src/rgw/rgw_client_io*
          - src/rgw/rgw_http_client*
          - src/rgw/rgw_process*
          - src/rgw/rgw_main.*
          - src/rgw/rgw_appmain.cc
          - src/rgw/rgw_frontend.*
          - src/rgw/rgw_loadgen*
          - src/rgw/rgw_env.cc
          - src/rgw/rgw_signal.*
          - src/rgw/rgw_resolve.*
          - src/rgw/rgw_worker.h
          - src/rgw/rgw_request.h
          - src/rgw/rgw_req_context.h
          - src/rgw/yield_completion.h
          - src/rgw/async_utils.h
        scope: headline
        kind: product
        difficulty: standard
        why: Coroutine-based HTTP serving and request lifecycle; a Go/Rust port would sit on a stock HTTP stack, so standard rather than hard.
      - id: s3-api
        name: S3 API operations
        description: S3 REST handlers and op implementations - objects, buckets, multipart, ACLs, CORS, website, tagging, object lock, checksums, compression.
        globs:
          - src/rgw/rgw_op.*
          - src/rgw/rgw_op_type.h
          - src/rgw/rgw_rest.*
          - src/rgw/rgw_rest_s3.*
          - src/rgw/rgw_rest_s3website.h
          - src/rgw/rgw_rest_s3control.*
          - src/rgw/rgw_rest_zero.*
          - src/rgw/rgw_acl.*
          - src/rgw/rgw_acl_s3.*
          - src/rgw/rgw_acl_types.h
          - src/rgw/rgw_cors.*
          - src/rgw/rgw_cors_s3.*
          - src/rgw/rgw_website.*
          - src/rgw/rgw_tag.*
          - src/rgw/rgw_tag_s3.*
          - src/rgw/rgw_object_lock.*
          - src/rgw/rgw_object_ownership.*
          - src/rgw/rgw_public_access.*
          - src/rgw/rgw_multi.*
          - src/rgw/rgw_multi_del.*
          - src/rgw/rgw_multipart_meta_filter.*
          - src/rgw/rgw_policy_s3.*
          - src/rgw/rgw_xml.*
          - src/rgw/rgw_xml_enc.cc
          - src/rgw/rgw_formats.*
          - src/rgw/rgw_torrent.*
          - src/rgw/rgw_cksum*
          - src/rgw/rgw_crc_digest.h
          - src/rgw/rgw_blake3_digest.h
          - src/rgw/rgw_xxh_digest.h
          - src/rgw/rgw_compression*
          - src/rgw/rgw_http_errors.h
          - src/rgw/rgw_range_projection.h
        scope: headline
        kind: product
        difficulty: standard
        why: The brief's difficulty baseline; rgw_op.cc and rgw_rest_s3.cc dominate (~22k lines) and are wide but conventional request handling.
      - id: s3select
        name: S3 Select glue
        description: Glue binding the s3select SQL engine (submodule) to GetObject streaming for CSV/JSON/Parquet queries.
        globs:
          - src/rgw/rgw_s3select*
        scope: headline
        kind: product
        difficulty: glue
        why: Only the RGW-side adapter lives here; the query engine itself is the src/s3select submodule.
      - id: swift-api
        name: Swift API
        description: OpenStack Swift REST dialect - containers, SLO/DLO, bulk upload, Swift ACLs/CORS, TempAuth/TempURL/FormPost auth.
        globs:
          - src/rgw/rgw_rest_swift.*
          - src/rgw/rgw_acl_swift.*
          - src/rgw/rgw_cors_swift.h
          - src/rgw/rgw_swift_auth.*
          - src/rgw/rgw_tar.h
        scope: headline
        kind: product
        difficulty: standard
        why: A second REST dialect over the same ops; same shape as the S3 baseline.
      - id: auth
        name: Authentication (SigV4, Keystone, LDAP)
        description: Auth strategy framework, AWS SigV2/SigV4 and chunked-upload signing, Keystone tokens/EC2 creds, LDAP, OPA, radosgw-token.
        globs:
          - src/rgw/rgw_auth.*
          - src/rgw/rgw_auth_filters.h
          - src/rgw/rgw_auth_registry.h
          - src/rgw/rgw_auth_s3.*
          - src/rgw/rgw_auth_keystone.*
          - src/rgw/rgw_keystone*
          - src/rgw/rgw_ldap.*
          - src/rgw/rgw_token.*
          - src/rgw/rgw_opa.*
        scope: headline
        kind: product
        difficulty: standard
        why: Security-sensitive but well specified by AWS/OpenStack docs; the strategy-applier template machinery is the main porting friction.
      - id: iam-sts
        name: IAM, STS and accounts
        description: IAM policy engine, managed policies, IAM user/group/role/account REST APIs, STS AssumeRole(WithWebIdentity), OIDC providers, ARNs.
        globs:
          - src/rgw/rgw_iam_policy*
          - src/rgw/rgw_iam_managed_policy.*
          - src/rgw/rgw_rest_iam*
          - src/rgw/rgw_role.*
          - src/rgw/rgw_rest_role.*
          - src/rgw/rgw_sts.*
          - src/rgw/rgw_rest_sts.*
          - src/rgw/rgw_web_idp.h
          - src/rgw/rgw_oidc_provider.*
          - src/rgw/rgw_rest_oidc_provider.*
          - src/rgw/rgw_rest_user_policy.*
          - src/rgw/rgw_account.*
          - src/rgw/rgw_rest_account.*
          - src/rgw/rgw_arn.*
          - src/rgw/rgw_polparser.cc
          - src/rgw/rgw_poltester.cc
        scope: headline
        kind: product
        difficulty: standard
        why: AWS-compatible policy evaluation and IAM REST handlers; the policy evaluator needs care but is request-handling class work.
      - id: encryption
        name: Server-side encryption and KMS
        description: SSE-C/SSE-KMS/SSE-S3 block crypto filters, bucket default encryption, Vault/Barbican/KMIP/testing key backends and key cache.
        globs:
          - src/rgw/rgw_crypt*
          - src/rgw/rgw_kms*
          - src/rgw/rgw_kmip*
          - src/rgw/rgw_bucket_encryption.*
        scope: headline
        kind: product
        difficulty: standard
        why: Streaming AES filters plus REST clients to key managers; on-disk crypto metadata must stay compatible.
      - id: notifications
        name: Bucket notifications (pubsub)
        description: S3 bucket notification and SNS-style topic APIs, event filtering, AMQP and Kafka endpoint clients.
        globs:
          - src/rgw/rgw_pubsub.*
          - src/rgw/rgw_rest_pubsub.*
          - src/rgw/rgw_amqp.*
          - src/rgw/rgw_kafka.*
          - src/rgw/rgw_notify_event_type.*
          - src/rgw/rgw_s3_filter.*
        scope: headline
        kind: product
        difficulty: standard
        why: Topic/notification config handling plus broker clients that map onto mature Go/Rust libraries.
      - id: lifecycle
        name: Lifecycle, restore and expiry
        description: S3 lifecycle rule parsing and the LC worker (expiration, transition, noncurrent versions), cloud restore, Swift object expirer.
        globs:
          - src/rgw/rgw_lc*
          - src/rgw/rgw_restore*
          - src/rgw/rgw_rest_restore.*
          - src/rgw/rgw_object_expirer.cc
        scope: headline
        kind: product
        difficulty: standard
        why: Background sharded worker with lease handling over bucket listings; rgw_lc.cc is ~3.6k lines of policy logic.
      - id: qos-quota
        name: Quota, rate limiting and QoS
        description: User/bucket quota enforcement and stats cache, per-user/bucket rate limits, dmclock request scheduler.
        globs:
          - src/rgw/rgw_quota*
          - src/rgw/rgw_ratelimit.h
          - src/rgw/rgw_rest_ratelimit.*
          - src/rgw/rgw_dmclock*
        scope: headline
        kind: product
        difficulty: standard
        why: Counters, caches and a scheduler adapter around the dmclock library.
      - id: ops-logging
        name: Ops log, bucket logging and usage
        description: Ops log sinks, S3 bucket access logging, usage accounting, perf counters and tracing hooks.
        globs:
          - src/rgw/rgw_log.*
          - src/rgw/rgw_bucket_logging*
          - src/rgw/rgw_rest_bucket_logging.*
          - src/rgw/rgw_usage.*
          - src/rgw/rgw_perf_counters.*
          - src/rgw/rgw_tracer.*
        scope: headline
        kind: product
        difficulty: standard
        why: Log record formatting and batched writers; straightforward service code.
      - id: lua
        name: Lua scripting
        description: Per-request and background Lua hooks exposing request, object and data-filter bindings to user scripts.
        globs:
          - src/rgw/rgw_lua*
        scope: headline
        kind: product
        difficulty: standard
        why: Large binding surface over the Lua C API; a port would re-bind to an embedded Lua such as gopher-lua or mlua.
      - id: sal-common
        name: SAL abstraction and common types
        description: Storage Abstraction Layer interfaces and filter driver, shared request state, bucket/object/user types, layouts, caches, AIO throttles.
        globs:
          - src/rgw/rgw_sal.*
          - src/rgw/rgw_sal_store.h
          - src/rgw/rgw_sal_fwd.h
          - src/rgw/rgw_sal_filter.*
          - src/rgw/rgw_sal_config.h
          - src/rgw/rgw_common.*
          - src/rgw/rgw_basic_types.*
          - src/rgw/rgw_bucket.*
          - src/rgw/rgw_bucket_types.h
          - src/rgw/rgw_bucket_layout.*
          - src/rgw/rgw_obj_types.h
          - src/rgw/rgw_obj_manifest.cc
          - src/rgw/rgw_user.cc
          - src/rgw/rgw_user_types.h
          - src/rgw/rgw_placement_types.h
          - src/rgw/rgw_pool_types.h
          - src/rgw/rgw_cache.*
          - src/rgw/rgw_aio*
          - src/rgw/rgw_putobj.*
          - src/rgw/rgw_data_access.*
          - src/rgw/rgw_dencoder.cc
          - src/rgw/rgw_string.*
          - src/rgw/rgw_hex.h
          - src/rgw/rgw_b64.h
          - src/rgw/rgw_url.*
          - src/rgw/rgw_tools.cc
          - src/rgw/rgw_gc_log.h
          - src/rgw/rgw_jsonparser.cc
          - src/rgw/rgw_multiparser.cc
        scope: headline
        kind: product
        difficulty: standard
        why: Interfaces and shared types every op and driver uses; encodings of bucket/object types must stay wire-compatible with the cls_rgw side.
      - id: build-vendored
        name: Build files, docs and vendored libraries
        description: CMake/Cargo build files and lockfile, maintainers doc, vendored jwt-cpp, picojson and CRC implementations (madler, SPDK).
        globs:
          - src/rgw/CMakeLists.txt
          - src/rgw/Cargo.*
          - src/rgw/MAINTAINERS.md
          - src/rgw/jwt-cpp/**
          - src/rgw/picojson/**
          - src/rgw/madler/**
          - src/rgw/spdk/**
        scope: not-ported
        kind: config
        difficulty: config
        why: Packaging and third-party code a port replaces with ecosystem libraries; Cargo.lock alone is 8.7k lines.
      - id: other
        name: Other RGW
        description: Remaining RGW sources not claimed by a specific feature.
        globs:
          - src/rgw/**
        scope: headline
        kind: product
        difficulty: standard
        why: Catch-all remainder.

  - id: rgw-access
    group: rgw
    name: RGW alternative access paths
    description: Non-HTTP-S3 ways into RGW - librgw/NFS, Arrow Flight, cuObject RDMA, and the S3 Vectors service with its LanceDB Rust backend.
    root: [src/rgw/rgw_file, src/rgw/rgw_lib, src/rgw/librgw.cc, src/rgw/rgw_os_lib, src/rgw/rgw_flight, src/rgw/rgw_cuobj, src/rgw/rgw_s3vector, src/rgw/rgw_rest_s3vector, src/rgw/rgw_rest_vector_bucket, src/rgw/rgw_sal_wrapper, src/rgw/lancedb-rgw-store/, src/rgw/rgw-lancedb/]
    features:
      - id: librgw-nfs
        name: librgw file API (NFS-Ganesha FSAL)
        description: librgw library and the rgw_file POSIX-like namespace over buckets used by NFS-Ganesha.
        globs:
          - src/rgw/rgw_file*
          - src/rgw/rgw_lib*
          - src/rgw/librgw.cc
          - src/rgw/rgw_os_lib.*
        scope: headline
        kind: product
        difficulty: standard
        why: Maps a file handle/directory model onto bucket listings with its own handle cache; moderate state but no on-disk format.
      - id: arrow-flight
        name: Arrow Flight frontend
        description: Apache Arrow Flight server exposing object data as Arrow record batches.
        globs:
          - src/rgw/rgw_flight*
        scope: headline
        kind: product
        difficulty: glue
        why: Thin adapter onto the Arrow Flight SDK, which has Go and Rust implementations.
      - id: cuobj-rdma
        name: cuObject RDMA transport
        description: Runtime-loaded shim to the NVIDIA cuObject server library for RDMA PUT/GET data transfer.
        globs:
          - src/rgw/rgw_cuobj*
        scope: headline
        kind: product
        difficulty: glue
        why: Small dlopen ABI shim and transport wrapper; the heavy lifting is the vendor SDK.
      - id: s3vectors
        name: S3 Vectors
        description: S3 Vectors API (vector buckets, indexes, put/query vectors), background indexer, metadata filters, and the SAL C wrapper LanceDB calls into.
        globs:
          - src/rgw/rgw_s3vector*
          - src/rgw/rgw_rest_s3vector.*
          - src/rgw/rgw_rest_vector_bucket.*
          - src/rgw/rgw_sal_wrapper.*
        scope: headline
        kind: product
        difficulty: standard
        why: New AWS-compatible REST service plus a background worker; request-handling class.
      - id: lancedb-store
        name: LanceDB object-store backend (Rust)
        description: Rust crates implementing Arrow object_store over the RGW SAL C API so LanceDB indexes live in RGW.
        globs:
          - src/rgw/lancedb-rgw-store/src/**
          - src/rgw/lancedb-rgw-store/include/**
          - src/rgw/lancedb-rgw-store/build.rs
          - src/rgw/rgw-lancedb/src/**
          - src/rgw/rgw-lancedb/build.rs
        scope: headline
        kind: product
        difficulty: glue
        why: Already Rust; an FFI adapter between two APIs.
      - id: lancedb-tests
        name: LanceDB store tests
        description: Rust integration tests for the RGW object_store adapter.
        globs:
          - src/rgw/lancedb-rgw-store/tests/**
        scope: headline
        kind: test
        difficulty: glue
        why: Unit-level tests of the adapter.
      - id: lancedb-build
        name: LanceDB crate manifests and docs
        description: Cargo manifests and README for the LanceDB crates.
        globs:
          - src/rgw/lancedb-rgw-store/Cargo.toml
          - src/rgw/lancedb-rgw-store/README.md
          - src/rgw/rgw-lancedb/Cargo.toml
        scope: not-ported
        kind: config
        difficulty: config
        why: Packaging metadata and docs.

  - id: rgw-rados
    group: rgw
    name: RGW RADOS store and multisite
    description: The production RADOS SAL driver and its services - bucket index, GC, multisite replication, sync modules, dedup, persistent notifications.
    root: [src/rgw/driver/rados/, src/rgw/services/]
    features:
      - id: rados-store
        name: RADOS object store core
        description: RGWRados and the RADOS SAL implementation - head/tail object layout, manifests, atomic/multipart/append writers, system-object and cls services.
        globs:
          - src/rgw/driver/rados/rgw_rados.*
          - src/rgw/driver/rados/rgw_sal_rados.*
          - src/rgw/driver/rados/rgw_putobj_processor.*
          - src/rgw/driver/rados/rgw_obj_manifest.*
          - src/rgw/driver/rados/rgw_tools.*
          - src/rgw/driver/rados/rgw_service.*
          - src/rgw/driver/rados/shard_io.h
          - src/rgw/driver/rados/rgw_etag_verifier.*
          - src/rgw/driver/rados/rgw_d3n_datacache.*
          - src/rgw/services/svc_sys_obj*
          - src/rgw/services/svc_config_key*
          - src/rgw/services/svc_cls.*
          - src/rgw/services/svc_notify.*
          - src/rgw/services/svc_quota.*
          - src/rgw/services/svc_tier_rados.h
        scope: headline
        kind: product
        difficulty: hard
        why: Defines RGW's on-RADOS object layout and manifest encoding, which must remain bit-compatible with existing clusters; rgw_rados.cc alone is 12.9k lines.
      - id: bucket-index
        name: Bucket index, bilog and resharding
        description: Sharded bucket index operations via cls_rgw, bucket index log, bucket instance metadata, and dynamic resharding.
        globs:
          - src/rgw/driver/rados/rgw_bucket.*
          - src/rgw/driver/rados/buckets.*
          - src/rgw/driver/rados/rgw_bilog.*
          - src/rgw/driver/rados/rgw_reshard.*
          - src/rgw/services/svc_bi*
          - src/rgw/services/svc_bucket.*
          - src/rgw/services/svc_bucket_sobj.*
        scope: headline
        kind: product
        difficulty: hard
        why: Concurrency-sensitive index consistency and online reshard with layout generations; on-disk index entries are encoded formats.
      - id: gc-expiry
        name: Garbage collection and object expiry
        description: Tail-object GC queue processing and the time-index driven object expirer core.
        globs:
          - src/rgw/driver/rados/rgw_gc.*
          - src/rgw/driver/rados/rgw_gc_log.cc
          - src/rgw/driver/rados/rgw_object_expirer_core.*
        scope: headline
        kind: product
        difficulty: standard
        why: Background workers over cls_rgw_gc queues; moderate logic.
      - id: multisite-config
        name: Multisite realms, zonegroups and periods
        description: Realm/zonegroup/zone configuration model, period commit/push/pull/history, realm reload, and the RADOS-backed config store.
        globs:
          - src/rgw/rgw_zone*
          - src/rgw/rgw_period*
          - src/rgw/rgw_realm*
          - src/rgw/driver/rados/config/**
          - src/rgw/driver/rados/rgw_rest_realm.*
          - src/rgw/rgw_rest_config.*
          - src/rgw/services/svc_zone*
        scope: headline
        kind: product
        difficulty: standard
        why: Configuration objects with epoch/period versioning; must interoperate with existing clusters but is mostly CRUD plus validation.
      - id: multisite-sync
        name: Multisite metadata and data sync
        description: Coroutine framework, metadata and data/bucket sync state machines, datalog/mdlog, sync policy, trimming and the /admin/log REST API.
        globs:
          - src/rgw/rgw_coroutine.*
          - src/rgw/rgw_cr_rest.*
          - src/rgw/rgw_rest_conn.*
          - src/rgw/rgw_rest_client.*
          - src/rgw/rgw_sync_policy.*
          - src/rgw/rgw_bucket_sync*
          - src/rgw/rgw_metadata.cc
          - src/rgw/rgw_mdlog_types.h
          - src/rgw/rgw_meta_sync_status.h
          - src/rgw/rgw_rest_metadata.*
          - src/rgw/driver/rados/rgw_data_sync.*
          - src/rgw/driver/rados/rgw_sync.*
          - src/rgw/driver/rados/rgw_datalog*
          - src/rgw/driver/rados/rgw_log_backing.*
          - src/rgw/driver/rados/rgw_mdlog.h
          - src/rgw/driver/rados/rgw_metadata*
          - src/rgw/driver/rados/rgw_sync_trace.*
          - src/rgw/driver/rados/rgw_sync_error_repo.*
          - src/rgw/driver/rados/rgw_sync_counters.*
          - src/rgw/driver/rados/sync_fairness.*
          - src/rgw/driver/rados/rgw_trim_*
          - src/rgw/driver/rados/rgw_rest_log.*
          - src/rgw/driver/rados/rgw_cr_rados.*
          - src/rgw/driver/rados/rgw_cr_tools.*
          - src/rgw/driver/rados/rgw_sync_module.*
          - src/rgw/services/svc_mdlog.*
          - src/rgw/services/svc_bucket_sync*
          - src/rgw/services/svc_sync_modules.*
        scope: headline
        kind: product
        difficulty: hard
        why: Distributed, resumable replication state machines on a bespoke coroutine runtime (rgw_data_sync.cc ~7k lines); correctness under partial failure and log-generation changes is subtle.
      - id: sync-modules
        name: Sync modules (cloud sync, Elasticsearch)
        description: Pluggable sync targets - AWS/S3 cloud sync, Elasticsearch metadata indexing with its query frontend, and log module.
        globs:
          - src/rgw/driver/rados/rgw_sync_module_*
          - src/rgw/rgw_es_*
        scope: headline
        kind: product
        difficulty: standard
        why: Sync-target plugins built on the sync framework; mostly REST client logic.
      - id: lc-cloud-tier
        name: Lifecycle cloud transition
        description: Transitions objects to a remote S3 cloud tier with multipart upload and restore support.
        globs:
          - src/rgw/driver/rados/rgw_lc_tier.*
        scope: headline
        kind: product
        difficulty: standard
        why: Outbound S3 client logic driven by lifecycle.
      - id: notifications-persistent
        name: Persistent notifications and topics
        description: Persistent notification queues via cls_2pc_queue, push endpoints (HTTP/AMQP/Kafka), topic metadata storage and migration.
        globs:
          - src/rgw/driver/rados/rgw_notify.*
          - src/rgw/driver/rados/rgw_pubsub_push.*
          - src/rgw/driver/rados/topic*
        scope: headline
        kind: product
        difficulty: standard
        why: Reservation/commit queueing and retry over RADOS queues; service-class logic.
      - id: users-iam-metadata
        name: Users, accounts and IAM metadata storage
        description: RADOS persistence of users, access keys, accounts, groups, roles, OIDC providers and MFA/OTP, plus the user admin ops backend.
        globs:
          - src/rgw/driver/rados/rgw_user.*
          - src/rgw/driver/rados/users.*
          - src/rgw/driver/rados/account.*
          - src/rgw/driver/rados/group*
          - src/rgw/driver/rados/role*
          - src/rgw/driver/rados/oidc*
          - src/rgw/driver/rados/rgw_otp.*
          - src/rgw/services/svc_user*
        scope: headline
        kind: product
        difficulty: standard
        why: Metadata CRUD with index objects and uniqueness constraints; encodings must stay compatible.
      - id: dedup
        name: Deduplication
        description: Cluster-wide offline object deduplication - scan epochs, fingerprint tables, cross-RGW coordination, remapping, and its admin REST.
        globs:
          - src/rgw/driver/rados/rgw_dedup*
          - src/rgw/rgw_rest_dedup.*
        scope: headline
        kind: product
        difficulty: hard
        why: Rewrites object manifests in place and coordinates across gateways; correctness errors lose data.
      - id: bucket-logging-rados
        name: Bucket logging RADOS backend
        description: RADOS storage for pending bucket-logging records and their commit to log objects.
        globs:
          - src/rgw/driver/rados/rgw_bl_rados.*
        scope: headline
        kind: product
        difficulty: standard
        why: Backend half of the bucket-logging feature.
      - id: other
        name: Other RADOS driver
        description: Remaining RADOS driver and service sources.
        globs:
          - src/rgw/driver/rados/**
          - src/rgw/services/**
        scope: headline
        kind: product
        difficulty: standard
        why: Catch-all remainder.

  - id: rgw-drivers
    group: rgw
    name: RGW alternative storage drivers
    description: Non-RADOS SAL backends and filters - POSIX, DBStore/SQLite, DAOS, D4N cache, config stores, and the FoundationDB client wrapper.
    root: [src/rgw/driver/, src/rgw/fdb/]
    features:
      - id: posix
        name: POSIX driver
        description: SAL driver storing buckets as directories and objects as files, with an LMDB-backed bucket listing cache and inotify.
        globs:
          - src/rgw/driver/posix/**
        scope: headline
        kind: product
        difficulty: standard
        why: Filesystem-backed store with its own listing cache; conventional systems code.
      - id: posix-vendored
