      - id: snapshots-tables
        name: Snapshots and MDS tables
        description: Snap realms and the snap server/client, inode number table, and the generic table client/server protocol.
        globs:
          - src/mds/SnapRealm.*
          - src/mds/SnapServer.*
          - src/mds/SnapClient.*
