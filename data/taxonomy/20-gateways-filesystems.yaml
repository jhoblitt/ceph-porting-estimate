          - src/mds/RecoveryQueue.*
          - src/mds/inode_backtrace.*
        scope: headline
        kind: product
        difficulty: hard
        why: Brief names MDS cache as hard; MDCache.cc alone is 15.6k lines of cross-rank replication and rejoin state machines.
      - id: locking-caps
        name: Distributed locking and capabilities
        description: Locker state machines (simple/scatter/file/local locks), client capability issue/revoke, file locks (flock/fcntl).
        globs:
          - src/mds/Locker.*
