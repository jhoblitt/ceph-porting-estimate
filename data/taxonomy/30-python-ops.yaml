# Group 3: Python and operations tooling. ceph @ ec322a5e95ebcb46dec7d6a9d7813a34543c64ad
# Components are appended as each is finished.
components:
  - id: python-bindings
    group: common
    name: Python language bindings
    description: Cython bindings for librados, librbd, libcephfs and librgw, plus the shared CLI argument/daemon-socket helpers.
    root: src/pybind/
    features:
      - id: rados
        name: rados binding
        description: Cython wrapper over librados (cluster handle, pools, ioctx, object I/O, omap, watch/notify, mon/osd/mgr commands).
        globs: [src/pybind/rados/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Thin 1:1 FFI layer over the librados C API; porting means re-binding the same C calls, not re-deriving logic.
      - id: rbd
        name: rbd binding
        description: Cython wrapper over librbd (images, snapshots, clones, mirroring, groups, namespaces, migration).
        globs: [src/pybind/rbd/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Largest binding (rbd.pyx ~6.2k lines) but still a direct mapping of librbd C entry points.
      - id: cephfs
        name: cephfs binding
        description: Cython wrapper over libcephfs (mount, path and fd I/O, xattrs, snapshots, quiesce).
        globs: [src/pybind/cephfs/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Direct mapping of the libcephfs C API.
      - id: rgw
        name: rgw (librgw file) binding
        description: Cython wrapper over the librgw NFS-style file API.
        globs: [src/pybind/rgw/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Small direct mapping of the librgw C API.
      - id: cli-support
        name: CLI argument and admin-socket helpers
        description: ceph_argparse (mon command descriptor parsing and validation), ceph_daemon (admin socket client, perf counter display), mgr REPL.
        globs: [src/pybind/ceph_argparse.py, src/pybind/ceph_daemon.py, src/pybind/ceph_mgr_repl.py]
        scope: headline
        kind: product
        difficulty: glue
        why: Pure-Python support shared by the ceph CLI; typed argument validators and socket framing, modest logic.
      - id: packaging
        name: Binding build and packaging
        description: setup.py, pyproject, MANIFEST and CMake/tox glue that builds the Cython extensions.
        globs: [src/pybind/CMakeLists.txt, src/pybind/tox.ini,
                src/pybind/rados/setup.py, src/pybind/rados/pyproject.toml, src/pybind/rados/MANIFEST.in, src/pybind/rados/CMakeLists.txt,
                src/pybind/rbd/setup.py, src/pybind/rbd/pyproject.toml, src/pybind/rbd/MANIFEST.in, src/pybind/rbd/CMakeLists.txt,
                src/pybind/cephfs/setup.py, src/pybind/cephfs/pyproject.toml, src/pybind/cephfs/MANIFEST.in, src/pybind/cephfs/CMakeLists.txt,
                src/pybind/rgw/setup.py, src/pybind/rgw/pyproject.toml, src/pybind/rgw/MANIFEST.in, src/pybind/rgw/CMakeLists.txt]
        scope: not-ported
        kind: config
        difficulty: config
        why: Build/packaging glue; replaced wholesale by the target language's build system.
      - id: other
        name: Other
        description: Remainder of src/pybind not claimed by a binding or the mgr components.
        globs: [src/pybind/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Catch-all.
  - id: mgr-modules
    group: management
    name: Ceph Manager Python modules
    description: The Python modules hosted by ceph-mgr (orchestration, CephFS/RBD/NFS/SMB management, autoscaling, metrics, telemetry), excluding the dashboard.
    root: src/pybind/mgr/
    features:
      - id: framework
        name: Module framework
        description: MgrModule base class, option/command plumbing, CLI decorators and output formatting, cherrypy hosting, secrets client types.
        globs: [src/pybind/mgr/mgr_module.py, src/pybind/mgr/mgr_util.py, src/pybind/mgr/object_format.py, src/pybind/mgr/cherrypy_mgr.py, src/pybind/mgr/ceph_module.pyi,
                src/pybind/mgr/ceph_secrets_client.py, src/pybind/mgr/ceph_secrets_types.py, src/pybind/mgr/cli_api/**]
        scope: headline
        kind: product
        difficulty: standard
        why: The Python half of the mgr module API every module depends on; must be reproduced against the C++ PyModule bridge.
      - id: cephadm-core
        name: cephadm orchestrator core
        description: The cephadm mgr module - host inventory, placement scheduling, the serve/reconcile loop, SSH transport, agent, upgrades, cert management, migrations.
        globs: [src/pybind/mgr/cephadm/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Largest orchestration logic in ceph (module/serve/inventory/upgrade ~13k lines); a reconcile loop with placement and staggered upgrade, baseline-level request/state logic.
      - id: cephadm-services
        name: cephadm daemon service specs
        description: Per-daemon-type deployment logic (mon, mgr, osd, rgw, nfs, ingress, smb, nvmeof, monitoring stack, mgmt gateway, ...).
        globs: [src/pybind/mgr/cephadm/services/**]
        scope: headline
        kind: product
        difficulty: standard
        why: One class per service type generating daemon configs and keyrings; many small but logic-bearing units.
      - id: cephadm-templates
        name: cephadm daemon config templates
        description: Jinja templates for generated daemon configs (haproxy, keepalived, nginx, grafana, prometheus, alertmanager, ganesha, ...).
        globs: [src/pybind/mgr/cephadm/templates/**]
        scope: headline
        kind: config
        difficulty: config
        why: Declarative template data, carried over as-is.
      - id: cephadm-tests
        name: cephadm orchestrator tests
        description: Unit tests for the cephadm mgr module.
        globs: [src/pybind/mgr/cephadm/tests/**]
        scope: headline
        kind: test
        difficulty: glue
        why: Mock-heavy pytest suite (~29k lines), half of the module by volume.
      - id: orchestrator-api
        name: Orchestrator interface and backends
        description: The orchestrator abstraction and its 'ceph orch' CLI, plus the Rook and test backends.
        globs: [src/pybind/mgr/orchestrator/**, src/pybind/mgr/rook/**, src/pybind/mgr/test_orchestrator/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Backend-neutral API (_interface.py) and large CLI surface; the Rook backend translates specs to Rook CRs via the Kubernetes API.
      - id: cephfs-volumes
        name: CephFS volumes and subvolumes
        description: The volumes module - volume/subvolume/group lifecycle, versioned subvolume layouts, async clones and purge.
        globs: [src/pybind/mgr/volumes/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Stateful CephFS management with on-disk subvolume metadata versions and async job queues; the CSI backend.
      - id: nfs
        name: NFS exports and clusters
        description: Manages NFS-Ganesha clusters and exports (CephFS and RGW), ganesha config generation, QoS.
        globs: [src/pybind/mgr/nfs/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Export CRUD with Ganesha config parse/emit stored in RADOS objects.
      - id: smb
        name: SMB shares and clusters
        description: Declarative SMB cluster/share resources, staging and validation, stores, and Samba config generation.
        globs: [src/pybind/mgr/smb/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Resource model with staged apply across several stores; real domain logic.
      - id: cephfs-snapshots-mirroring
        name: CephFS snapshot scheduling and mirroring
        description: snap_schedule (scheduled snapshots and retention, sqlite-backed) and mirroring (directory-to-mirror-daemon mapping, peer management).
        globs: [src/pybind/mgr/snap_schedule/**, src/pybind/mgr/mirroring/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Two CephFS data-protection modules with persistent state and a directory-assignment state machine.
      - id: rbd-support
        name: RBD support
        description: rbd_support - mirror snapshot schedules, trash purge schedules, background task queue, per-image perf stats.
        globs: [src/pybind/mgr/rbd_support/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Scheduler and task queue built on librbd; moderate logic.
      - id: placement-automation
        name: Balancer and autoscalers
        description: balancer (upmap / crush-compat optimization), pg_autoscaler, mds_autoscaler.
        globs: [src/pybind/mgr/balancer/**, src/pybind/mgr/pg_autoscaler/**, src/pybind/mgr/mds_autoscaler/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Numeric optimization over the OSDMap/PG distribution; correctness-sensitive but bounded.
      - id: metrics-exporters
        name: Metrics and status exporters
        description: prometheus exporter, influx, telegraf, k8sevents, iostat, stats/osd_perf_query, status.
        globs: [src/pybind/mgr/prometheus/**, src/pybind/mgr/influx/**, src/pybind/mgr/telegraf/**, src/pybind/mgr/k8sevents/**, src/pybind/mgr/iostat/**, src/pybind/mgr/stats/**,
                src/pybind/mgr/osd_perf_query/**, src/pybind/mgr/status/**]
        scope: headline
        kind: product
        difficulty: standard
        why: Metric collection and export; prometheus module (~2.9k lines) carries most of it.
      - id: health-telemetry
        name: Health, crash and telemetry reporting
        description: telemetry, crash, devicehealth, diskprediction_local, insights, alerts, feedback, progress.
        globs: [src/pybind/mgr/telemetry/**, src/pybind/mgr/crash/**, src/pybind/mgr/devicehealth/**, src/pybind/mgr/diskprediction_local/**, src/pybind/mgr/insights/**,
                src/pybind/mgr/alerts/**, src/pybind/mgr/feedback/**, src/pybind/mgr/progress/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Mostly collection, anonymization and reporting of cluster state; little algorithmic content.
      - id: diskprediction-models
        name: Disk failure prediction models
        description: Pickled SVM models and their config for diskprediction_local.
        globs: [src/pybind/mgr/diskprediction_local/models/**]
        scope: not-ported
        kind: config
        difficulty: config
        why: Binary corpora (pickles), not source.
      - id: small-modules
        name: Small utility modules
        description: secrets store, nvmeof, rgw realm bootstrap, localpool, osd_support, selftest, hello.
        globs: [src/pybind/mgr/ceph_secrets/**, src/pybind/mgr/nvmeof/**, src/pybind/mgr/rgw/**, src/pybind/mgr/localpool/**, src/pybind/mgr/osd_support/**, src/pybind/mgr/selftest/**, src/pybind/mgr/hello/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Thin modules wrapping mon commands or a single store; little logic each.
      - id: tests
        name: Module unit tests
        description: Unit tests for the framework and non-cephadm modules, plus the Rook e2e CI harness.
        globs: [src/pybind/mgr/tests/**, src/pybind/mgr/ceph_secrets/tests/**, src/pybind/mgr/cli_api/tests/**, src/pybind/mgr/insights/tests/**, src/pybind/mgr/mds_autoscaler/tests/**,
                src/pybind/mgr/nfs/tests/**, src/pybind/mgr/nvmeof/tests/**, src/pybind/mgr/orchestrator/tests/**, src/pybind/mgr/pg_autoscaler/tests/**, src/pybind/mgr/rgw/tests/**,
                src/pybind/mgr/rook/ci/**, src/pybind/mgr/rook/tests/**, src/pybind/mgr/smb/tests/**, src/pybind/mgr/snap_schedule/tests/**, src/pybind/mgr/telemetry/tests/**,
                src/pybind/mgr/volumes/tests/**, src/pybind/mgr/prometheus/test_module.py, src/pybind/mgr/progress/test_progress.py]
        scope: headline
        kind: test
        difficulty: glue
        why: pytest suites against mocked mgr state; smb (~10k) and nfs (~3.9k) dominate.
      - id: build-config
        name: Lint, tox and packaging config
        description: tox, pylint, requirements, CMake install rules and dev scaffolding (Vagrant, repo file).
        globs: [src/pybind/mgr/tox.ini, src/pybind/mgr/.pylintrc, src/pybind/mgr/.gitignore, src/pybind/mgr/CMakeLists.txt, src/pybind/mgr/requirements.txt, src/pybind/mgr/requirements-required.txt,
                src/pybind/mgr/telemetry/tox.ini, src/pybind/mgr/snap_schedule/tox.ini, src/pybind/mgr/snap_schedule/requirements.txt, src/pybind/mgr/snap_schedule/.gitignore,
                src/pybind/mgr/rook/CMakeLists.txt, src/pybind/mgr/rook/requirements.txt, src/pybind/mgr/rook/.gitignore, src/pybind/mgr/rook/generate_rook_ceph_client.sh,
                src/pybind/mgr/diskprediction_local/requirements.txt, src/pybind/mgr/cephadm/Vagrantfile, src/pybind/mgr/cephadm/vagrant.config.example.json,
                src/pybind/mgr/cephadm/ceph.repo, src/pybind/mgr/cephadm/.gitignore]
        scope: not-ported
        kind: config
        difficulty: config
        why: Python build/lint tooling, replaced by the target language's toolchain.
      - id: other
        name: Other
        description: Remainder of src/pybind/mgr outside the dashboard.
        globs: [src/pybind/mgr/**]
        scope: headline
        kind: product
        difficulty: glue
        why: Catch-all.
  - id: dashboard
    group: management
    name: Ceph Dashboard
    description: The mgr dashboard module - a cherrypy REST backend in Python and an Angular single-page frontend.
    root: src/pybind/mgr/dashboard/
    features:
      - id: rest-framework
        name: Backend REST framework and module bootstrap
        description: Controller/router/endpoint decorators, CRUD scaffolding, OpenAPI doc generation, task tracking, plugin system, module entry point and shared tools.
        globs:
          - "src/pybind/mgr/dashboard/controllers/_*.py"
          - "src/pybind/mgr/dashboard/controllers/__init__.py"
          - "src/pybind/mgr/dashboard/controllers/docs.py"
          - "src/pybind/mgr/dashboard/controllers/task.py"
          - "src/pybind/mgr/dashboard/controllers/settings.py"
          - "src/pybind/mgr/dashboard/controllers/frontend_logging.py"
          - "src/pybind/mgr/dashboard/module.py"
          - "src/pybind/mgr/dashboard/tools.py"
          - "src/pybind/mgr/dashboard/rest_client.py"
          - "src/pybind/mgr/dashboard/exceptions.py"
          - "src/pybind/mgr/dashboard/security.py"
          - "src/pybind/mgr/dashboard/settings.py"
          - "src/pybind/mgr/dashboard/cli.py"
          - "src/pybind/mgr/dashboard/__init__.py"
          - "src/pybind/mgr/dashboard/plugins/**"
          - "src/pybind/mgr/dashboard/api/**"
          - "src/pybind/mgr/dashboard/services/_paginate.py"
          - "src/pybind/mgr/dashboard/services/exception.py"
          - "src/pybind/mgr/dashboard/services/settings.py"
          - "src/pybind/mgr/dashboard/services/progress.py"
          - "src/pybind/mgr/dashboard/services/__init__.py"
        scope: headline
        kind: product
        difficulty: standard
        why: A small in-house web framework (routing, RBAC-aware endpoints, OpenAPI emission, async task tracking) every controller rests on.
      - id: auth-rbac
        name: Authentication, users and RBAC
        description: Login/JWT sessions, local user and role store with permission scopes, password policy, SAML2 and OAuth2 SSO.
        globs:
          - "src/pybind/mgr/dashboard/controllers/auth.py"
          - "src/pybind/mgr/dashboard/controllers/user.py"
          - "src/pybind/mgr/dashboard/controllers/role.py"
          - "src/pybind/mgr/dashboard/controllers/saml2.py"
          - "src/pybind/mgr/dashboard/controllers/oauth2.py"
          - "src/pybind/mgr/dashboard/services/access_control.py"
          - "src/pybind/mgr/dashboard/services/auth/**"
          - "src/pybind/mgr/dashboard/services/sso.py"
        scope: headline
        kind: product
        difficulty: standard
        why: Security-sensitive but conventional web auth; ~2.5k lines.
      - id: block
        name: Block storage management (RBD, iSCSI, NVMe-oF)
        description: RBD images, snapshots, trash and mirroring; iSCSI targets; NVMe-oF gateway subsystems via gRPC.
        globs:
          - "src/pybind/mgr/dashboard/controllers/rbd.py"
          - "src/pybind/mgr/dashboard/controllers/rbd_mirroring.py"
          - "src/pybind/mgr/dashboard/controllers/iscsi.py"
          - "src/pybind/mgr/dashboard/controllers/nvmeof.py"
          - "src/pybind/mgr/dashboard/services/rbd.py"
          - "src/pybind/mgr/dashboard/services/iscsi_client.py"
          - "src/pybind/mgr/dashboard/services/iscsi_config.py"
          - "src/pybind/mgr/dashboard/services/iscsi_cli.py"
          - "src/pybind/mgr/dashboard/services/tcmu_service.py"
          - "src/pybind/mgr/dashboard/services/nvmeof_cli.py"
          - "src/pybind/mgr/dashboard/services/nvmeof_client.py"
          - "src/pybind/mgr/dashboard/services/nvmeof_conf.py"
          - "src/pybind/mgr/dashboard/services/nvmeof_top_cli.py"
          - "src/pybind/mgr/dashboard/model/nvmeof.py"
        scope: headline
        kind: product
        difficulty: standard
        why: Largest controller family (nvmeof.py ~3k lines); request handling over librbd and gateway clients.
      - id: rgw
        name: Object gateway management
        description: RGW buckets, users, accounts, IAM roles, multisite and zone config via the RGW admin API with SigV4 signing.
        globs:
          - "src/pybind/mgr/dashboard/controllers/rgw.py"
          - "src/pybind/mgr/dashboard/controllers/rgw_iam.py"
          - "src/pybind/mgr/dashboard/services/rgw_client.py"
          - "src/pybind/mgr/dashboard/services/rgw_iam.py"
          - "src/pybind/mgr/dashboard/model/rgw.py"
          - "src/pybind/mgr/dashboard/awsauth.py"
        scope: headline
        kind: product
        difficulty: standard
        why: Admin-API client (rgw_client.py ~3.4k lines) plus controllers; request handling at the baseline level.
      - id: file
        name: File services management (CephFS, NFS, SMB)
        description: CephFS volumes, subvolumes, snapshots and quotas; NFS exports; SMB clusters and shares.
        globs:
          - "src/pybind/mgr/dashboard/controllers/cephfs.py"
          - "src/pybind/mgr/dashboard/controllers/nfs.py"
          - "src/pybind/mgr/dashboard/controllers/smb.py"
          - "src/pybind/mgr/dashboard/services/cephfs.py"
        scope: headline
        kind: product
        difficulty: standard
        why: Controllers delegating to libcephfs and the nfs/smb mgr modules.
      - id: cluster
        name: Cluster, host, OSD and pool management
        description: Health/summary, hosts, OSDs, pools, CRUSH and EC profiles, config, services/daemons via orchestrator, monitoring proxies (Prometheus, Grafana, Loki), certificates, multi-cluster.
        globs:
          - "src/pybind/mgr/dashboard/controllers/**"
          - "src/pybind/mgr/dashboard/services/**"
          - "src/pybind/mgr/dashboard/model/**"
          - "src/pybind/mgr/dashboard/grafana.py"
        scope: headline
        kind: product
        difficulty: standard
        why: The general cluster-administration controllers and their service helpers; many mid-sized request handlers.
      - id: backend-tests
        name: Backend unit tests
        description: pytest suites for controllers, services and the REST framework.
        globs:
          - "src/pybind/mgr/dashboard/tests/**"
        scope: headline
        kind: test
        difficulty: glue
        why: Controller-level tests against a mocked mgr; ~17.5k lines.
      - id: ci-harness
        name: Dashboard CI and test runners
        description: cephadm-based e2e cluster bootstrap scripts, grafana dashboard checks, and run-*-tests.sh wrappers.
        globs:
          - "src/pybind/mgr/dashboard/ci/**"
          - "src/pybind/mgr/dashboard/run-backend-api-tests.sh"
          - "src/pybind/mgr/dashboard/run-backend-api-request.sh"
          - "src/pybind/mgr/dashboard/run-backend-rook-api-request.sh"
          - "src/pybind/mgr/dashboard/run-frontend-e2e-tests.sh"
          - "src/pybind/mgr/dashboard/run-frontend-unittests.sh"
        scope: headline
        kind: test
        difficulty: glue
        why: Shell glue that stands up clusters and runs test suites.
      - id: generated
        name: Generated and vendored backend artifacts
        description: openapi.yaml (emitted by tox openapi-fix), gRPC Python stubs and the vendored NVMe-oF gateway.proto.
        globs:
          - "src/pybind/mgr/dashboard/openapi.yaml"
          - "src/pybind/mgr/dashboard/services/proto/**"
        scope: not-ported
        kind: config
        difficulty: config
        why: Regenerated from source, or copied from ceph-nvmeof.
      - id: backend-build-config
        name: Backend lint, tox and packaging config
        description: tox, pylint, requirements, CMake and editor config for the backend.
        globs:
          - "src/pybind/mgr/dashboard/tox.ini"
          - "src/pybind/mgr/dashboard/.pylintrc"
          - "src/pybind/mgr/dashboard/.coveragerc"
          - "src/pybind/mgr/dashboard/.editorconfig"
          - "src/pybind/mgr/dashboard/.gitignore"
          - "src/pybind/mgr/dashboard/CMakeLists.txt"
          - "src/pybind/mgr/dashboard/requirements.txt"
          - "src/pybind/mgr/dashboard/requirements-lint.txt"
          - "src/pybind/mgr/dashboard/requirements-test.txt"
          - "src/pybind/mgr/dashboard/constraints.txt"
          - "src/pybind/mgr/dashboard/HACKING.rst"
          - "src/pybind/mgr/dashboard/README.rst"
        scope: not-ported
        kind: config
        difficulty: config
        why: Python toolchain config, replaced by the target toolchain.
      - id: fe-block
        name: Frontend block storage pages
        description: Angular pages for RBD images, mirroring, iSCSI and NVMe-oF.
        globs:
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/block/**/*.{html,scss}"
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/block/**/*[!c].ts"
        scope: shown
        kind: product
        difficulty: glue
        why: Forms, tables and wizards over the REST API; UI glue rather than storage logic.
      - id: fe-rgw
        name: Frontend object gateway pages
        description: Angular pages for buckets, users, accounts, roles, multisite and RGW config.
        globs:
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/rgw/**/*.{html,scss}"
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/rgw/**/*[!c].ts"
        scope: shown
        kind: product
        difficulty: glue
        why: Largest page family (multisite wizard, bucket policy editors) but still UI over REST.
      - id: fe-file
        name: Frontend file services pages
        description: Angular pages for CephFS, NFS exports and SMB.
        globs:
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/{cephfs,nfs,smb}/**/*.{html,scss}"
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/{cephfs,nfs,smb}/**/*[!c].ts"
        scope: shown
        kind: product
        difficulty: glue
        why: UI over the file-services REST endpoints.
      - id: fe-cluster
        name: Frontend cluster pages and overview
        description: Angular pages for hosts, OSDs, pools, services, config, monitoring, the overview/landing dashboards and shared ceph widgets.
        globs:
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/{cluster,pool,overview,dashboard-v3,performance-counter,shared}/**/*.{html,scss}"
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/{cluster,pool,overview,dashboard-v3,performance-counter,shared}/**/*[!c].ts"
          - "src/pybind/mgr/dashboard/frontend/src/app/ceph/ceph.module.ts"
        scope: shown
        kind: product
        difficulty: glue
        why: UI over the cluster-administration REST endpoints.
      - id: fe-shared
        name: Frontend shared library
        description: REST API client services, datatable, form helpers and validators, reusable components, pipes, directives, models.
        globs:
