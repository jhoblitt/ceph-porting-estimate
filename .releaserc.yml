branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      # Data, methods-page and explanatory changes are user-visible content
      # of the report, so docs/refactor/perf changes must cut a release; only
      # chore/ci/test/build/style merges release nothing. The built-in revert
      # rule fires only on a "This reverts commit <sha>." body line, which a
      # hand-written `revert:` squash may lack; the type rule covers it.
      releaseRules:
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
        - type: revert
          release: patch
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      # presetConfig.types replaces the preset's default list, which hides
      # docs/refactor/perf. Every type releaseRules above can cut a release
      # from has to be visible here, or a release built only from those types
      # ships notes with nothing under the header.
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: perf
            section: Performance Improvements
          - type: refactor
            section: Refactoring
          - type: docs
            section: Documentation
          - type: revert
            section: Reverts
          - type: chore
            hidden: true
          - type: ci
            hidden: true
          - type: build
            hidden: true
          - type: test
            hidden: true
          - type: style
            hidden: true
  # Publish the GitHub Release and nothing else: no comment or label on the
  # pull requests and issues a release resolves, and no issue opened or
  # closed for a failed release.
  - - "@semantic-release/github"
    - successCommentCondition: false
      failCommentCondition: false
